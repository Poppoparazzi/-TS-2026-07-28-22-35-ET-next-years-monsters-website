# TS: 2026-08-22 03:23 ET

name: Live rating count probe

on:
  pull_request:
    paths:
      - ".github/workflows/live-rating-count-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Diagnose live production rating rollout
        run: |
          node --input-type=module <<'NODE'
          const base = "https://next-years-monsters-api.onrender.com";
          const getJson = async (url) => {
            const response = await fetch(url, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(90000),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          };

          const first = await getJson(`${base}/api/universe/status?limit=5000`);
          if (!first.response.ok || !first.body) {
            console.log(JSON.stringify({ stage: "status", httpStatus: first.response.status, body: first.body }, null, 2));
            process.exit(1);
          }

          const startup = await getJson(`${base}/api/startup-status`).catch(() => null);
          const companies = Array.isArray(first.body.companies) ? first.body.companies : [];
          const candidate = companies.find((company) =>
            company &&
            company.ticker &&
            company.hasRating !== true &&
            company.hasSecIdentity === true &&
            company.hasFilings === true &&
            company.hasFacts === true
          );

          console.log(JSON.stringify({
            stage: "before",
            ratingCompleteCount: first.body.ratingCompleteCount ?? null,
            fullyCompleteCount: first.body.fullyCompleteCount ?? null,
            candidate: candidate?.ticker ?? null,
            companyCount: companies.length,
            secEvidenceReadyCount: first.body.secEvidenceReadyCount ?? null,
            deployedCommit: startup?.body?.deployment?.commit ?? startup?.body?.deploymentCommit ?? null,
            ratingJob: startup?.body?.jobs?.ratingBatch ?? null,
          }, null, 2));

          if (!candidate?.ticker) process.exit(0);

          const ticker = String(candidate.ticker).trim().toUpperCase();
          const rating = await getJson(`${base}/api/ratings/${encodeURIComponent(ticker)}`);
          console.log(JSON.stringify({
            stage: "rating_attempt",
            ticker,
            httpStatus: rating.response.status,
            eligible: rating.body?.eligible ?? null,
            score: rating.body?.score ?? null,
            error: rating.body?.error ?? null,
            eligibilityCode: rating.body?.eligibilityCode ?? null,
            message: rating.body?.message ?? rating.body?.summary ?? null,
          }, null, 2));

          const after = await getJson(`${base}/api/universe/status?limit=5000`);
          console.log(JSON.stringify({
            stage: "after",
            ratingCompleteCount: after.body?.ratingCompleteCount ?? null,
            httpStatus: after.response.status,
          }, null, 2));
          NODE
