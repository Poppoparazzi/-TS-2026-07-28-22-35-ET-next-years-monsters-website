# TS: 2026-08-16 21:31 ET
name: Verify public customer journey (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Require core customer journey files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f start-here.html
          test -f monster-check.html
          test -f top-monsters.html
          test -f how-it-works.html
          test -f vcl-library.html
          test -f about.html
          echo "Core customer journey files are present on gh-pages."
