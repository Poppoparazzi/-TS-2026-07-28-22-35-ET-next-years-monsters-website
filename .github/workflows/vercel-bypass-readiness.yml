# TS: 2026-08-14 15:03 ET
name: Vercel bypass readiness

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/vercel-bypass-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-vercel-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run backend checks
        run: npm run check

      - name: Boot backend in Vercel runtime mode
        env:
          VERCEL: "1"
          VERCEL_GIT_COMMIT_SHA: "0123456789abcdef0123456789abcdef01234567"
          VERCEL_GIT_COMMIT_REF: "main"
          PORT: "8787"
          HOST: "127.0.0.1"
          NODE_ENV: "production"
          MARKET_DATA_PROVIDER: "unconfigured"
          CORS_ORIGIN: "https://nextyearsmonsters.com"
        run: |
          set -euo pipefail
          npm run dev > /tmp/nym-vercel-bypass.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/nym-vercel-bypass.log || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/api/startup-status > /tmp/startup-status.json; then
              break
            fi
            sleep 1
          done

          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/startup-status.json', 'utf8'));
          if (payload.runtime !== 'serverless') {
            throw new Error(`Expected runtime=serverless, got ${payload.runtime}`);
          }
          if (payload.startupJobsEnabled !== false) {
            throw new Error(`Expected startupJobsEnabled=false, got ${payload.startupJobsEnabled}`);
          }
          if (payload.deployment?.provider !== 'vercel') {
            throw new Error(`Expected deployment.provider=vercel, got ${payload.deployment?.provider ?? '(missing)'}`);
          }
          if (payload.deployment?.commit !== '0123456789abcdef0123456789abcdef01234567') {
            throw new Error(`Expected Vercel deployment commit metadata, got ${payload.deployment?.commit ?? '(missing)'}`);
          }
          if (payload.deployment?.branch !== 'main') {
            throw new Error(`Expected Vercel deployment branch=main, got ${payload.deployment?.branch ?? '(missing)'}`);
          }
          console.log('Vercel collateral runtime verified:', {
            runtime: payload.runtime,
            startupJobsEnabled: payload.startupJobsEnabled,
            deployment: payload.deployment,
          });
          NODE

      - name: Verify fail-closed AAPL route without market credentials
        env:
          VERCEL: "1"
          PORT: "8788"
          HOST: "127.0.0.1"
          NODE_ENV: "production"
          MARKET_DATA_PROVIDER: "unconfigured"
          CORS_ORIGIN: "https://nextyearsmonsters.com"
        run: |
          set -euo pipefail
          npm run dev > /tmp/nym-vercel-rating.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true; cat /tmp/nym-vercel-rating.log || true' EXIT

          code="000"
          for attempt in $(seq 1 30); do
            code=$(curl --silent --output /tmp/aapl-rating.json --write-out '%{http_code}' http://127.0.0.1:8788/api/ratings/AAPL || true)
            if [ "$code" != "000" ]; then
              break
            fi
            sleep 1
          done

          HTTP_CODE="$code" node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/aapl-rating.json', 'utf8'));
          const httpCode = process.env.HTTP_CODE;

          if (httpCode !== '503') {
            throw new Error(`Expected HTTP 503 while market provider is deliberately unconfigured, got ${httpCode}`);
          }
          if (payload.error !== 'provider_not_configured') {
            throw new Error(`Expected provider_not_configured, got ${payload.error ?? '(missing)'}`);
          }
          if (Object.prototype.hasOwnProperty.call(payload, 'score') && payload.score !== null) {
            throw new Error(`Unconfigured market provider must never return a numeric score, got ${payload.score}`);
          }

          console.log('AAPL safely fails closed on the Vercel bypass with no invented score:', {
            httpCode,
            error: payload.error,
          });
          NODE
