# TS: 2026-08-03 13:59 ET

name: Phase B live queue snapshot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture deployment and reserve-pool snapshot
        run: |
          node --input-type=module <<'NODE'
          const apiBaseUrl = "https://next-years-monsters-api.onrender.com";

          async function getJson(path) {
            const response = await fetch(`${apiBaseUrl}${path}`, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(70_000),
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            return payload;
          }

          const [startup, reserve, published] = await Promise.all([
            getJson("/api/startup-status"),
            getJson("/api/universe/status?limit=2300"),
            getJson("/api/universe/status?limit=2000"),
          ]);

          console.log(JSON.stringify({
            checkedAt: new Date().toISOString(),
            deploymentCommit: startup?.deploymentCommit || null,
            importState: startup?.jobs?.universeImport?.state || null,
            importSummary: startup?.jobs?.universeImport?.summary || null,
            batchState: startup?.jobs?.secUniverseBatch?.state || null,
            batchSummary: startup?.jobs?.secUniverseBatch?.summary || null,
            reserve: {
              universeSize: Number(reserve.universeSize || 0),
              examinedCount: Number(reserve.examinedCount || 0),
              queuedCount: Number(reserve.queuedCount || 0),
              processingCount: Number(reserve.processingCount || 0),
              secCompleteCount: Number(reserve.secCompleteCount || 0),
              unresolvedCount: Number(reserve.unresolvedCount || 0),
              failedCount: Number(reserve.failedCount || 0),
            },
            published: {
              examinedCount: Number(published.examinedCount || 0),
              queuedCount: Number(published.queuedCount || 0),
              processingCount: Number(published.processingCount || 0),
              secCompleteCount: Number(published.secCompleteCount || 0),
              unresolvedCount: Number(published.unresolvedCount || 0),
              failedCount: Number(published.failedCount || 0),
            },
          }, null, 2));
          NODE
