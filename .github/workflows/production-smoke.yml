# TS: 2026-08-02 21:33 ET

name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "render.yaml"
      - "factory-status.html"
      - "assets/factory-status.*"
      - "scripts/verify-production.mjs"
      - ".github/workflows/production-smoke.yml"
  pull_request:
    paths:
      - ".production-smoke-trigger*"

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Confirm completed 500-company SEC batch
        run: |
          node --input-type=module <<'NODE'
          const url = "https://next-years-monsters-api.onrender.com/api/universe/status?limit=500";
          const response = await fetch(url, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(70_000),
          });
          const status = await response.json();

          if (!response.ok) {
            throw new Error(`Universe endpoint returned HTTP ${response.status}.`);
          }

          const summary = {
            universeSize: Number(status.universeSize || 0),
            examinedCount: Number(status.examinedCount || 0),
            queuedCount: Number(status.queuedCount || 0),
            processingCount: Number(status.processingCount || 0),
            secCompleteCount: Number(status.secCompleteCount || 0),
            unresolvedCount: Number(status.unresolvedCount || 0),
            failedCount: Number(status.failedCount || 0),
            partialCount: Number(status.partialCount || 0),
            staleCount: Number(status.staleCount || 0),
            filingCompleteCount: Number(status.filingCompleteCount || 0),
            factsCompleteCount: Number(status.factsCompleteCount || 0),
            quoteCompleteCount: Number(status.quoteCompleteCount || 0),
            ratingCompleteCount: Number(status.ratingCompleteCount || 0),
            generatedAt: status.generatedAt || null,
          };

          console.log("Final 500-company universe status:");
          console.log(JSON.stringify(summary, null, 2));

          const problems = [];
          if (summary.examinedCount !== 500) {
            problems.push(`examinedCount is ${summary.examinedCount}, expected 500`);
          }
          if (summary.processingCount !== 0) {
            problems.push(`processingCount is ${summary.processingCount}, expected 0`);
          }
          if (summary.failedCount !== 0) {
            problems.push(`failedCount is ${summary.failedCount}, expected 0`);
          }
          if (summary.secCompleteCount + summary.unresolvedCount !== 500) {
            problems.push(
              `secCompleteCount + unresolvedCount is ${summary.secCompleteCount + summary.unresolvedCount}, expected 500`,
            );
          }

          if (problems.length) {
            throw new Error(problems.join("; "));
          }
          NODE

      - name: Verify Render API, 500-company database, and public factory page
        env:
          NYM_EXPECTED_VERSION: "0.6.0"
          NYM_EXPECTED_UNIVERSE_MIN: "500"
          NYM_SMOKE_ATTEMPTS: "10"
          NYM_SMOKE_DELAY_MS: "30000"
        run: node scripts/verify-production.mjs
