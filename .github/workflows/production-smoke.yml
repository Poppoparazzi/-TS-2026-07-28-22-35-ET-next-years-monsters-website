# TS: 2026-08-21 15:16 UTC

name: Production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify 5,000-candidate reserve and 2,200 SEC evidence-ready target
        env:
          NYM_UNIVERSE_STATUS_LIMIT: "5000"
          NYM_EXPECTED_USABLE_TARGET: "2200"
        run: node scripts/verify-sec-evidence-readiness.mjs

      - name: Verify Render API, broad reserve accounting, rating route, and customer journey
        env:
          NYM_EXPECTED_VERSION: "0.6.0"
          NYM_EXPECTED_UNIVERSE_MIN: "5000"
          NYM_UNIVERSE_STATUS_LIMIT: "5000"
          NYM_EXPECTED_USABLE_TARGET: "2200"
          NYM_SMOKE_ATTEMPTS: "1"
          NYM_SMOKE_DELAY_MS: "0"
        run: node scripts/verify-production.mjs
