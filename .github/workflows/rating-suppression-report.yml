# TS: 2026-08-29 04:03 ET

name: Monster Rating suppression report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rating-suppression-report.yml"
      - "backend/src/jobs/report-rating-candidate-suppression.ts"
      - "backend/package.json"
  workflow_run:
    workflows: ["Monster Rating rollout worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund

      - name: Report real provider-history suppression
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing; suppression counts cannot be read from the production-capable database context."
            exit 0
          fi
          npm run --prefix backend ratings:suppression-report
