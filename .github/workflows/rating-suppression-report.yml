# TS: 2026-09-06 02:03 ET

name: Monster Rating suppression report

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rating-suppression-report.yml"
      - "backend/src/jobs/report-rating-candidate-suppression.ts"
      - "backend/src/jobs/report-rating-suppression-overlap.ts"
      - "backend/src/jobs/report-rating-suppression-reconciliation.ts"
      - "backend/package.json"
  workflow_run:
    workflows: ["Monster Rating rollout worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --prefix backend --no-audit --no-fund

      - name: Record real provider-history suppression
        id: suppression
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing; suppression counts cannot be read from the production-capable database context."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p ops
          npm run --prefix backend ratings:suppression-report --silent > ops/rating-suppression.json
          npx --prefix backend tsx backend/src/jobs/report-rating-suppression-overlap.ts > ops/rating-suppression-overlap.json
          npx --prefix backend tsx backend/src/jobs/report-rating-suppression-reconciliation.ts > ops/rating-suppression-reconciliation.json
          cat ops/rating-suppression.json
          cat ops/rating-suppression-overlap.json
          cat ops/rating-suppression-reconciliation.json
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Persist exact suppression snapshot
        if: steps.suppression.outputs.available == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/rating-suppression.json ops/rating-suppression-overlap.json ops/rating-suppression-reconciliation.json
          git diff --cached --quiet && exit 0
          git commit -m "Record live Monster Rating suppression status"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          echo "Unable to persist suppression snapshot after three push attempts." >&2
          exit 1
