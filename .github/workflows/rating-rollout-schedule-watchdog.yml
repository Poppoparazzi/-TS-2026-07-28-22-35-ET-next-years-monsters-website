# TS: 2026-08-27 04:00 ET

name: Monster Rating schedule watchdog

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: monster-rating-schedule-watchdog
  cancel-in-progress: false

jobs:
  ensure-rollout-is-running:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch rating worker only when recent runs are missing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: rating-rollout-worker.yml
          STALE_AFTER_MINUTES: "45"
        run: |
          node --input-type=module <<'NODE'
          const repo = process.env.REPOSITORY;
          const workflow = process.env.WORKFLOW_FILE;
          const staleAfterMs = Number(process.env.STALE_AFTER_MINUTES || 45) * 60 * 1000;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };

          const runsUrl = `https://api.github.com/repos/${repo}/actions/workflows/${workflow}/runs?branch=main&per_page=1`;
          const runsResponse = await fetch(runsUrl, { headers });
          if (!runsResponse.ok) {
            throw new Error(`Could not inspect rating worker runs: HTTP ${runsResponse.status}`);
          }
          const runsBody = await runsResponse.json();
          const latest = Array.isArray(runsBody.workflow_runs) ? runsBody.workflow_runs[0] : null;
          const latestAt = latest?.run_started_at || latest?.created_at || null;
          const latestMs = latestAt ? Date.parse(latestAt) : Number.NaN;
          const ageMs = Number.isFinite(latestMs) ? Date.now() - latestMs : Number.POSITIVE_INFINITY;

          console.log(JSON.stringify({
            latestRunId: latest?.id ?? null,
            latestEvent: latest?.event ?? null,
            latestStatus: latest?.status ?? null,
            latestConclusion: latest?.conclusion ?? null,
            latestAt,
            ageMinutes: Number.isFinite(ageMs) ? Math.round(ageMs / 60000) : null,
            staleAfterMinutes: Math.round(staleAfterMs / 60000),
          }, null, 2));

          if (ageMs <= staleAfterMs) {
            console.log("A recent Monster Rating worker run exists; no fallback dispatch is needed.");
            process.exit(0);
          }

          const dispatchUrl = `https://api.github.com/repos/${repo}/actions/workflows/${workflow}/dispatches`;
          const dispatchResponse = await fetch(dispatchUrl, {
            method: "POST",
            headers: { ...headers, "Content-Type": "application/json" },
            body: JSON.stringify({ ref: "main" }),
          });
          if (!dispatchResponse.ok) {
            const detail = await dispatchResponse.text().catch(() => "");
            throw new Error(`Fallback rating-worker dispatch failed: HTTP ${dispatchResponse.status} ${detail}`.trim());
          }
          console.log("Dispatched the Monster Rating rollout worker because no run appeared in the last 45 minutes.");
          NODE
