# TS: 2026-08-27 21:01 ET

name: Live rating ops probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-rating-ops-probe.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Probe production and recent Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';

          const base = 'https://next-years-monsters-api.onrender.com';
          async function get(path) {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(90000),
            });
            const body = await response.json().catch(() => null);
            return { status: response.status, body };
          }

          const [health, universe, startup, aapl] = await Promise.all([
            get('/api/health'),
            get('/api/universe/status?limit=5000'),
            get('/api/startup-status'),
            get('/api/ratings/AAPL'),
          ]);

          let actionRuns = [];
          try {
            const raw = execFileSync('gh', [
              'api',
              `repos/${process.env.REPO}/actions/runs?per_page=30`,
              '--jq',
              '.workflow_runs[] | {id,name,event,status,conclusion,head_sha,created_at,updated_at,html_url}'
            ], { encoding: 'utf8' });
            actionRuns = raw.trim().split('\n').filter(Boolean).map((line) => JSON.parse(line));
          } catch (error) {
            actionRuns = [{ probeError: String(error?.message || error) }];
          }

          const relevantRuns = actionRuns.filter((run) =>
            !run.name || /rating|render|phase 3|backend/i.test(run.name)
          ).slice(0, 15);

          const renderDeployHook = Boolean((process.env.RENDER_DEPLOY_HOOK_URL || '').trim());
          const renderApiKey = Boolean((process.env.RENDER_API_KEY || '').trim());
          const renderServiceId = Boolean((process.env.RENDER_SERVICE_ID || '').trim());
          const vercelAuthority = Boolean((process.env.VERCEL_TOKEN || '').trim());

          const output = {
            probedAt: new Date().toISOString(),
            healthStatus: health.status,
            universeStatus: universe.status,
            startupStatus: startup.status,
            aaplRatingStatus: aapl.status,
            aaplRatingEligibilityCode: aapl.body?.eligibilityCode ?? null,
            aaplRatingTier: aapl.body?.tier ?? null,
            ratingRouteMissing: aapl.status === 404,
            quoteCompleteCount: universe.body?.quoteCompleteCount ?? null,
            ratingCompleteCount: universe.body?.ratingCompleteCount ?? null,
            fullyCompleteCount: universe.body?.fullyCompleteCount ?? null,
            examinedCount: universe.body?.examinedCount ?? null,
            secCompleteCount: universe.body?.secCompleteCount ?? null,
            secEvidenceReadyCount: universe.body?.secEvidenceReadyCount ?? null,
            failedCount: universe.body?.failedCount ?? null,
            unresolvedCount: universe.body?.unresolvedCount ?? null,
            providerBackedRatings: Number(universe.body?.ratingCompleteCount ?? 0) <= Number(universe.body?.quoteCompleteCount ?? 0),
            marketConfigured: health.body?.marketData?.configured ?? null,
            deployedCommit: startup.body?.deployment?.commit ?? startup.body?.deploymentCommit ?? null,
            ratingJob: startup.body?.jobs?.ratingBatch ?? null,
            deploymentAuthority: {
              renderDeployHook,
              renderApiKey,
              renderServiceId,
              renderApiAuthority: renderApiKey && renderServiceId,
              renderAuthority: renderDeployHook || (renderApiKey && renderServiceId),
              vercelAuthority,
              missingRenderCredentials: [
                !renderDeployHook ? 'RENDER_DEPLOY_HOOK_URL' : null,
                !renderApiKey ? 'RENDER_API_KEY' : null,
                !renderServiceId ? 'RENDER_SERVICE_ID' : null,
              ].filter(Boolean),
            },
            relevantRuns,
          };

          if (!output.providerBackedRatings) {
            throw new Error(`Rating count ${output.ratingCompleteCount} exceeds quote count ${output.quoteCompleteCount}; refusing to record an ungrounded production state.`);
          }

          fs.mkdirSync('ops', { recursive: true });
          fs.writeFileSync('ops/live-rating-status.json', JSON.stringify(output, null, 2) + '\n');
          console.log(JSON.stringify(output, null, 2));
          NODE

      - name: Commit probe result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/live-rating-status.json
          if git diff --cached --quiet; then
            echo "No probe result change to commit."
            exit 0
          fi
          git commit -m "Record live Monster Rating ops status"
          git push
