# TS: 2026-08-15 02:58 ET
name: Verify website publication

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Verify publication payload
        shell: bash
        run: |
          set -euo pipefail
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "nextyearsmonsters.com"
          test -f site-version.json
          grep -q 'nym-publication-probe-2026-08-11-0902-ET' site-version.json
          test -f index.html
          test -f live-status.html
          test -f top-monsters.html
          test -f vcl-library.html
          test -f about.html
          test -f data/monster-tier-board-preview.json
          grep -q '25</strong><span>EXTERNAL MARKET TICKERS' live-status.html
          grep -q 'TEN MORE STOCKS.<br>NOW IN MARKET COVERAGE.' live-status.html
          grep -Eq '2026-08-12_2305_Detective-Break_Evidence-Future-Monster-Stock\.webp\?v=[0-9-]+' vcl-library.html
          grep -q 'Use the site in order' about.html
          python - <<'PY'
          import json
          with open('data/monster-tier-board-preview.json', encoding='utf-8') as handle:
              board = json.load(handle)
          assert len(board.get('top15', [])) == 15, 'Monster Hunt Top 15 payload must contain exactly 15 rows'
          print('Verified gh-pages payload: CNAME, publication probe, reconciled Data Status, VCL/About journey files, and 15-row Monster Hunt board are present.')
          PY

      - name: Verify Monster Hunt renderer emits all 15 case rows
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const board = JSON.parse(fs.readFileSync('data/monster-tier-board-preview.json', 'utf8'));
          const renderer = fs.readFileSync('assets/monster-tier-board-preview.js', 'utf8');

          const lists = Object.fromEntries(['top15', 'rising', 'watchlist', 'dropped'].map(key => [key, { innerHTML: '' }]));
          const counts = Object.fromEntries(['top15', 'rising', 'watchlist', 'dropped'].map(key => [key, { textContent: '' }]));
          const snapshot = { textContent: '' };
          const method = { textContent: '' };
          const snapshotStatus = { textContent: '' };
          const notes = [{ innerHTML: '' }, { innerHTML: '' }];
          let domReady = null;

          const document = {
            querySelector(selector) {
              if (selector === '[data-snapshot-date]') return snapshot;
              if (selector === '[data-score-method]') return method;
              if (selector === '.tier-snapshot-bar strong') return snapshotStatus;
              const countMatch = selector.match(/^\[data-count="([^"]+)"\]$/);
              if (countMatch) return counts[countMatch[1]] || null;
              const listMatch = selector.match(/^\[data-tier-list="([^"]+)"\]$/);
              if (listMatch) return lists[listMatch[1]] || null;
              return null;
            },
            querySelectorAll(selector) {
              if (selector === '.tier-method-note p') return notes;
              if (selector === '[data-tier-list]') return Object.values(lists);
              return [];
            },
            addEventListener(event, callback) {
              if (event === 'DOMContentLoaded') domReady = callback;
            },
          };

          const context = {
            document,
            console,
            fetch: async () => ({ ok: true, json: async () => board }),
            encodeURIComponent,
          };
          vm.createContext(context);
          vm.runInContext(renderer, context, { filename: 'monster-tier-board-preview.js' });

          (async () => {
            if (typeof domReady !== 'function') throw new Error('Monster Hunt renderer did not register DOMContentLoaded setup.');
            await domReady();
            await new Promise(resolve => setImmediate(resolve));

            const rendered = lists.top15.innerHTML;
            const rowCount = (rendered.match(/<article class="tier-row">/g) || []).length;
            const caseLinkCount = (rendered.match(/OPEN CASE FILE →/g) || []).length;
            if (rowCount !== 15) throw new Error(`Expected 15 rendered Top 15 rows, found ${rowCount}`);
            if (caseLinkCount !== 15) throw new Error(`Expected 15 rendered case-file links, found ${caseLinkCount}`);
            if (String(counts.top15.textContent) !== '15') throw new Error(`Top 15 visible count rendered as ${counts.top15.textContent}`);
            for (const stock of board.top15) {
              if (!rendered.includes(`$${stock.ticker}`)) throw new Error(`Rendered Monster Hunt is missing ${stock.ticker}`);
            }
            console.log('RENDER VERIFIED: Monster Hunt emits 15 visible Top 15 rows and 15 case-file links from the published board.');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Wait for exact gh-pages files on public custom domain
        shell: bash
        run: |
          set -euo pipefail

          wait_for_match() {
            local source_file="$1"
            local public_url="$2"
            local label="$3"
            local expected
            expected="$(sha256sum "$source_file" | awk '{print $1}')"

            for attempt in $(seq 1 18); do
              if curl --fail --silent --show-error --location \
                "${public_url}?cb=${GITHUB_SHA}-${attempt}" \
                -o /tmp/public-file; then
                actual="$(sha256sum /tmp/public-file | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  echo "PUBLIC BYTE MATCH: ${label} matches gh-pages at ${GITHUB_SHA}."
                  return 0
                fi
              fi
              echo "Waiting for public ${label} to match gh-pages (${attempt}/18)..."
              sleep 5
            done

            echo "ERROR: public ${label} never matched gh-pages commit ${GITHUB_SHA}." >&2
            return 1
          }

          wait_for_match "site-version.json" "https://nextyearsmonsters.com/site-version.json" "publication probe"
          wait_for_match "live-status.html" "https://nextyearsmonsters.com/live-status.html" "Data Status"
          wait_for_match "top-monsters.html" "https://nextyearsmonsters.com/top-monsters.html" "Monster Hunt HTML"
          wait_for_match "data/monster-tier-board-preview.json" "https://nextyearsmonsters.com/data/monster-tier-board-preview.json" "Monster Hunt Top 15 data"
          wait_for_match "vcl-library.html" "https://nextyearsmonsters.com/vcl-library.html" "VCL Library"
          wait_for_match "about.html" "https://nextyearsmonsters.com/about.html" "About"

      - name: Verify public Data Status, Monster Hunt, VCL, and About semantics
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://nextyearsmonsters.com/live-status.html?cb=${GITHUB_SHA}" \
            -o /tmp/public-live-status.html
          grep -q '25</strong><span>EXTERNAL MARKET TICKERS' /tmp/public-live-status.html
          grep -q 'TEN MORE STOCKS.<br>NOW IN MARKET COVERAGE.' /tmp/public-live-status.html

          curl --fail --silent --show-error --location \
            "https://nextyearsmonsters.com/top-monsters.html?cb=${GITHUB_SHA}" \
            -o /tmp/public-top-monsters.html
          grep -q 'data-tier-list="top15"' /tmp/public-top-monsters.html
          grep -q 'assets/monster-tier-board-preview.js' /tmp/public-top-monsters.html

          curl --fail --silent --show-error --location \
            "https://nextyearsmonsters.com/data/monster-tier-board-preview.json?cb=${GITHUB_SHA}" \
            -o /tmp/public-monster-board.json
          python - <<'PY'
          import json
          with open('/tmp/public-monster-board.json', encoding='utf-8') as handle:
              board = json.load(handle)
          top15 = board.get('top15', [])
          assert len(top15) == 15, f'Expected 15 public Top 15 rows, found {len(top15)}'
          assert all(item.get('ticker') and item.get('score_status') for item in top15), 'Every public Top 15 row must contain ticker and published score status'
          print('PUBLIC MONSTER HUNT VERIFIED: 15-row board is live on nextyearsmonsters.com.')
          PY

          curl --fail --silent --show-error --location \
            "https://nextyearsmonsters.com/vcl-library.html?cb=${GITHUB_SHA}" \
            -o /tmp/public-vcl.html
          grep -Eq '2026-08-12_2305_Detective-Break_Evidence-Future-Monster-Stock\.webp\?v=[0-9-]+' /tmp/public-vcl.html
          ! grep -q '2026-08-11_1725_Detective-Break_Break-On-The-Case.webp' /tmp/public-vcl.html

          curl --fail --silent --show-error --location \
            "https://nextyearsmonsters.com/about.html?cb=${GITHUB_SHA}" \
            -o /tmp/public-about.html
          grep -q 'Use the site in order' /tmp/public-about.html
          grep -q 'OPEN VCL™ LIBRARY' /tmp/public-about.html

          echo 'PUBLIC SCOREBOARD VERIFIED: exact gh-pages Data Status, Monster Hunt, VCL Library, and About are live on nextyearsmonsters.com.'
