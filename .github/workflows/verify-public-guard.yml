# TS: 2026-08-13 10:17 ET
name: Verify public guard files

on:
  push:
    branches:
      - gh-pages
    paths:
      - "assets/runtime-config.js"
      - "assets/rating-service-state-guard.js"
      - ".github/workflows/verify-public-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-files:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out publishing branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages

      - name: Validate wiring
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < CNAME)" = "nextyearsmonsters.com"
          grep -q 'rating-service-state-guard.js?v=20260813-1008' assets/runtime-config.js
          test -s assets/rating-service-state-guard.js

      - name: Wait for exact public files
        shell: bash
        run: |
          set -euo pipefail
          wait_for_match() {
            local source_file="$1"
            local public_url="$2"
            local label="$3"
            local expected
            expected="$(sha256sum "$source_file" | awk '{print $1}')"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --location "${public_url}?cb=${GITHUB_SHA}-${attempt}" -o /tmp/public-file; then
                actual="$(sha256sum /tmp/public-file | awk '{print $1}')"
                if [ "$actual" = "$expected" ]; then
                  echo "PUBLIC BYTE MATCH: ${label} matches gh-pages at ${GITHUB_SHA}."
                  return 0
                fi
              fi
              sleep 5
            done
            echo "ERROR: public ${label} did not match gh-pages commit ${GITHUB_SHA}." >&2
            return 1
          }
          wait_for_match "assets/runtime-config.js" "https://nextyearsmonsters.com/assets/runtime-config.js" "runtime config"
          wait_for_match "assets/rating-service-state-guard.js" "https://nextyearsmonsters.com/assets/rating-service-state-guard.js" "service-state guard"
