# TS: 2026-08-19 06:03 ET

name: Static site checks

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "CNAME"
      - "assets/**"
      - "data/**"
      - "scripts/validate-static-site.mjs"
      - "scripts/verify-frozen-functional-invariants.mjs"
      - ".github/workflows/static-site-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "CNAME"
      - "assets/**"
      - "data/**"
      - "scripts/validate-static-site.mjs"
      - "scripts/verify-frozen-functional-invariants.mjs"
      - ".github/workflows/static-site-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate local links, JavaScript, VCL order, and verification ledger
        run: node scripts/validate-static-site.mjs
