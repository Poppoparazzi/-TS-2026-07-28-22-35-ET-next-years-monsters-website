# TS: 2026-08-03 17:32 ET

name: Static site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate local links, JavaScript, VCL order, and verification ledger
        run: node scripts/validate-static-site.mjs

  read-live-production-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Read live Render 2,300-candidate and public 2,000 counts
        run: |
          node --input-type=module <<'NODE'
          const apiBaseUrl = "https://next-years-monsters-api.onrender.com";
          const attempts = 6;
          const delayMs = 20_000;
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function requestJson(path) {
            const response = await fetch(`${apiBaseUrl}${path}`, {
              headers: {
                Accept: "application/json",
                "User-Agent": "NextYearsMonsters-OneShot-Snapshot/1.0",
              },
              signal: AbortSignal.timeout(75_000),
            });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} HTTP ${response.status}: ${text.slice(0, 200)}`);
            try {
              return JSON.parse(text);
            } catch {
              throw new Error(`${path} returned non-JSON: ${text.slice(0, 200)}`);
            }
          }

          function counts(payload) {
            return {
              universeSize: Number(payload?.universeSize || 0),
              examinedCount: Number(payload?.examinedCount || 0),
              queuedCount: Number(payload?.queuedCount || 0),
              processingCount: Number(payload?.processingCount || 0),
              secCompleteCount: Number(payload?.secCompleteCount || 0),
              unresolvedCount: Number(payload?.unresolvedCount || 0),
              failedCount: Number(payload?.failedCount || 0),
              partialCount: Number(payload?.partialCount || 0),
              staleCount: Number(payload?.staleCount || 0),
              filingCompleteCount: Number(payload?.filingCompleteCount || 0),
              factsCompleteCount: Number(payload?.factsCompleteCount || 0),
              quoteCompleteCount: Number(payload?.quoteCompleteCount || 0),
              ratingCompleteCount: Number(payload?.ratingCompleteCount || 0),
            };
          }

          let lastError = null;
          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const health = await requestJson("/api/health");
              const startup = await requestJson("/api/startup-status");
              const reserve = counts(await requestJson("/api/universe/status?limit=2300"));
              const published = counts(await requestJson("/api/universe/status?limit=2000"));
              const snapshot = {
                checkedAt: new Date().toISOString(),
                attempt,
                health: {
                  version: health?.version || null,
                  databaseConfigured: Boolean(health?.database?.configured),
                  secConfigured: Boolean(health?.sec?.configured),
                  universeConfigured: Boolean(health?.universe?.configured),
                },
                startup: {
                  deploymentCommit: startup?.deploymentCommit || null,
                  importState: startup?.jobs?.universeImport?.state || null,
                  importSummary: startup?.jobs?.universeImport?.summary || null,
                  batchState: startup?.jobs?.secUniverseBatch?.state || null,
                  batchSummary: startup?.jobs?.secUniverseBatch?.summary || null,
                },
                reserve2300: reserve,
                public2000: published,
                reconciliation: {
                  reserveTerminal: reserve.secCompleteCount + reserve.unresolvedCount,
                  reserveOutstanding: reserve.queuedCount + reserve.processingCount + reserve.failedCount + reserve.partialCount + reserve.staleCount,
                  publicTerminal: published.secCompleteCount + published.unresolvedCount,
                  publicOutstanding: published.queuedCount + published.processingCount + published.failedCount + published.partialCount + published.staleCount,
                  publicHas2000Complete: published.examinedCount === 2000 && published.secCompleteCount === 2000,
                },
              };
              console.log("NYM_LIVE_PRODUCTION_SNAPSHOT");
              console.log(JSON.stringify(snapshot, null, 2));
              process.exit(0);
            } catch (error) {
              lastError = error instanceof Error ? error.message : String(error);
              console.log(`Snapshot attempt ${attempt}/${attempts} failed: ${lastError}`);
              if (attempt < attempts) await sleep(delayMs);
            }
          }
          throw new Error(`Live snapshot failed after ${attempts} attempts: ${lastError}`);
          NODE
