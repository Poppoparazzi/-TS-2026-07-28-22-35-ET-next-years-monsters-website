# TS: 2026-08-21 23:29 ET

name: Monster Rating rollout worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rating-rollout-worker.yml"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-rating-rollout
  cancel-in-progress: false

jobs:
  advance-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Advance production Monster Ratings
        env:
          API_BASE: https://next-years-monsters-api.onrender.com
          TARGET_COUNT: "500"
          STATUS_LIMIT: "5000"
          MAX_CANDIDATES_PER_RUN: "60"
          REQUEST_DELAY_MS: "20000"
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE;
          const target = Number(process.env.TARGET_COUNT || 500);
          const statusLimit = Number(process.env.STATUS_LIMIT || 5000);
          const maxCandidates = Number(process.env.MAX_CANDIDATES_PER_RUN || 60);
          const requestDelayMs = Number(process.env.REQUEST_DELAY_MS || 20000);
          const runNumber = Math.max(Number(process.env.RUN_NUMBER || 1), 1);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const protectedPriority = Object.freeze([
            "AAPL", "NVDA", "MNST", "AMZN", "TSLA", "NFLX", "AMD", "COST",
            "VRT", "AXON", "DECK", "WING", "META", "APP", "MSFT", "CRDO", "RKLB",
          ]);
          const priorityRank = new Map(protectedPriority.map((ticker, index) => [ticker, index]));

          async function getJson(url, timeoutMs = 70000) {
            const response = await fetch(url, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(timeoutMs),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function getStatus() {
            const { response, body } = await getJson(`${base}/api/universe/status?limit=${statusLimit}`);
            if (!response.ok || !body) throw new Error(`Universe status HTTP ${response.status}`);
            return body;
          }

          let health;
          let aapl;
          try {
            [health, aapl] = await Promise.all([
              getJson(`${base}/api/health`),
              getJson(`${base}/api/ratings/AAPL`),
            ]);
          } catch (error) {
            console.log(`Rating rollout deferred: production preflight unreachable (${error instanceof Error ? error.message : String(error)}).`);
            process.exit(0);
          }

          if (!health.response.ok || health.body?.marketData?.configured !== true) {
            console.log(`Rating rollout deferred: market-data preflight failed (HTTP ${health.response.status}).`);
            process.exit(0);
          }
          if (aapl.response.status === 404) {
            console.log("Rating rollout deferred: production rating route is missing.");
            process.exit(0);
          }

          const first = await getStatus();
          let liveCount = Number(first.ratingCompleteCount || 0);
          console.log(`Initial ratingCompleteCount=${liveCount}; target=${target}; runNumber=${runNumber}`);
          if (liveCount >= target) process.exit(0);

          console.log("Watching production for one minute before GitHub takes over...");
          await sleep(60000);
          const second = await getStatus();
          const secondCount = Number(second.ratingCompleteCount || 0);
          if (secondCount > liveCount) {
            console.log(`Render advanced ratings on its own: ${liveCount} -> ${secondCount}. Exiting to avoid duplicate usage.`);
            process.exit(0);
          }
          liveCount = secondCount;

          const companies = Array.isArray(second.companies) ? second.companies : [];
          const pool = companies.filter((company) =>
            company &&
            company.ticker &&
            company.hasRating !== true &&
            company.hasSecIdentity === true &&
            company.hasFilings === true &&
            company.hasFacts === true
          );

          const priority = pool
            .filter((company) => priorityRank.has(String(company.ticker).trim().toUpperCase()))
            .sort((left, right) =>
              (priorityRank.get(String(left.ticker).trim().toUpperCase()) ?? 999) -
              (priorityRank.get(String(right.ticker).trim().toUpperCase()) ?? 999)
            );

          const ordinary = pool
            .filter((company) => !priorityRank.has(String(company.ticker).trim().toUpperCase()))
            .sort((left, right) => String(left.ticker).localeCompare(String(right.ticker)));

          // Rotate ordinary candidates every run. Previously every run sliced the same
          // front cohort, so permanently ineligible names such as HOOD could be retried
          // forever while later candidates were never reached.
          const ordinarySlots = Math.max(maxCandidates - priority.length, 0);
          const rotationOffset = ordinary.length > 0
            ? ((runNumber - 1) * Math.max(ordinarySlots, 1)) % ordinary.length
            : 0;
          const rotatedOrdinary = ordinary.length === 0
            ? []
            : [...ordinary.slice(rotationOffset), ...ordinary.slice(0, rotationOffset)];
          const candidates = [...priority, ...rotatedOrdinary].slice(0, maxCandidates);

          console.log(JSON.stringify({
            candidatePool: pool.length,
            priorityCandidates: priority.length,
            ordinaryCandidates: ordinary.length,
            rotationOffset,
            selectedThisRun: candidates.length,
          }));

          let attempted = 0;
          let ratedThisRun = 0;
          let skipped = 0;
          let consecutiveProviderStops = 0;

          for (const company of candidates) {
            if (liveCount >= target) break;
            const ticker = String(company.ticker).trim().toUpperCase();
            if (!ticker) continue;
            attempted += 1;

            let result;
            try {
              result = await getJson(`${base}/api/ratings/${encodeURIComponent(ticker)}`);
            } catch (error) {
              consecutiveProviderStops += 1;
              console.log(`[network] ${ticker}: ${error instanceof Error ? error.message : String(error)}`);
              if (consecutiveProviderStops >= 3) break;
              await sleep(65000);
              continue;
            }

            const { response, body } = result;
            if (response.ok && body?.eligible === true && Number.isFinite(Number(body.score))) {
              ratedThisRun += 1;
              liveCount += 1;
              consecutiveProviderStops = 0;
              console.log(`[rated] ${ticker} score=${body.score} estimatedComplete=${liveCount}`);
            } else if (response.status === 429 || response.status === 503) {
              consecutiveProviderStops += 1;
              console.log(`[provider-stop] ${ticker} HTTP ${response.status}; consecutive=${consecutiveProviderStops}`);
              if (consecutiveProviderStops >= 3) break;
              await sleep(65000);
              continue;
            } else {
              skipped += 1;
              consecutiveProviderStops = 0;
              console.log(`[skip] ${ticker} HTTP ${response.status} eligible=${body?.eligible ?? null} code=${body?.eligibilityCode ?? body?.error ?? "unknown"}`);
            }

            if (attempted % 10 === 0) {
              const checkpoint = await getStatus().catch(() => null);
              if (checkpoint) {
                liveCount = Number(checkpoint.ratingCompleteCount || liveCount);
                console.log(`[checkpoint] live ratingCompleteCount=${liveCount}`);
              }
            }

            if (liveCount < target) await sleep(requestDelayMs);
          }

          const final = await getStatus().catch(() => null);
          const finalCount = final ? Number(final.ratingCompleteCount || liveCount) : liveCount;
          console.log(JSON.stringify({
            initialRatingCompleteCount: Number(first.ratingCompleteCount || 0),
            finalRatingCompleteCount: finalCount,
            target,
            attempted,
            ratedThisRun,
            skipped,
            rotationOffset,
          }, null, 2));
          NODE
