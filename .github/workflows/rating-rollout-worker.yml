# TS: 2026-08-21 22:57 ET

name: Monster Rating rollout worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rating-rollout-worker.yml"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-rating-rollout
  cancel-in-progress: false

jobs:
  advance-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Advance production Monster Ratings
        env:
          API_BASE: https://next-years-monsters-api.onrender.com
          TARGET_COUNT: "500"
          STATUS_LIMIT: "5000"
          MAX_CANDIDATES_PER_RUN: "60"
          REQUEST_DELAY_MS: "20000"
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE;
          const target = Number(process.env.TARGET_COUNT || 500);
          const statusLimit = Number(process.env.STATUS_LIMIT || 5000);
          const maxCandidates = Number(process.env.MAX_CANDIDATES_PER_RUN || 60);
          const requestDelayMs = Number(process.env.REQUEST_DELAY_MS || 20000);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          // Keep the first real rollout focused on the strategic/VCL names before
          // consuming quota on lower-priority reserve candidates.
          const protectedPriority = Object.freeze([
            "AAPL", "NVDA", "MNST", "AMZN", "TSLA", "NFLX", "AMD", "COST",
            "VRT", "AXON", "DECK", "WING", "META", "APP", "MSFT", "CRDO", "RKLB",
          ]);
          const priorityRank = new Map(protectedPriority.map((ticker, index) => [ticker, index]));

          async function getJson(url, timeoutMs = 70000) {
            const response = await fetch(url, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(timeoutMs),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function getStatus() {
            const { response, body } = await getJson(`${base}/api/universe/status?limit=${statusLimit}`);
            if (!response.ok || !body) {
              throw new Error(`Universe status failed with HTTP ${response.status}`);
            }
            return body;
          }

          // Preflight before touching the universe endpoint or spending provider quota.
          // An unreachable/stale backend is a deployment-recovery condition, not a
          // reason for this independent rating worker to fail every scheduled run.
          let healthResponse;
          let health;
          let ratingPreflight;
          try {
            [{ response: healthResponse, body: health }, ratingPreflight] = await Promise.all([
              getJson(`${base}/api/health`),
              getJson(`${base}/api/ratings/AAPL`),
            ]);
          } catch (error) {
            console.log(
              `Rating rollout deferred: production preflight is unreachable (${error instanceof Error ? error.message : String(error)}). ` +
              "Render recovery owns deployment repair.",
            );
            process.exit(0);
          }

          if (!healthResponse.ok || !health) {
            console.log(`Rating rollout deferred: /api/health returned HTTP ${healthResponse.status}.`);
            process.exit(0);
          }
          if (health?.marketData?.configured !== true) {
            console.log("Rating rollout deferred: licensed market-data provider is not configured in production.");
            process.exit(0);
          }
          if (ratingPreflight.response.status === 404) {
            console.log("Rating rollout deferred: /api/ratings/AAPL is not deployed yet. Render recovery must update the backend first.");
            process.exit(0);
          }
          if (!ratingPreflight.response.ok) {
            console.log(
              `Rating rollout deferred: AAPL rating preflight returned HTTP ${ratingPreflight.response.status} ` +
              `(${ratingPreflight.body?.error ?? ratingPreflight.body?.eligibilityCode ?? "unknown"}).`,
            );
            process.exit(0);
          }

          let first;
          try {
            first = await getStatus();
          } catch (error) {
            console.log(
              `Rating rollout deferred: universe status is unavailable after a healthy route preflight ` +
              `(${error instanceof Error ? error.message : String(error)}).`,
            );
            process.exit(0);
          }

          let liveCount = Number(first.ratingCompleteCount || 0);
          console.log(`Initial ratingCompleteCount=${liveCount}; target=${target}; statusLimit=${statusLimit}`);
          if (liveCount >= target) {
            console.log("500-rating target already reached.");
            process.exit(0);
          }

          // Give Render one minute to prove it is already advancing before GitHub
          // takes over. This avoids duplicate provider usage without wasting five minutes.
          console.log("Watching production for one minute before taking over...");
          await sleep(60000);
          const second = await getStatus().catch((error) => {
            console.log(
              `Rating rollout deferred: universe status became unavailable during the takeover watch ` +
              `(${error instanceof Error ? error.message : String(error)}).`,
            );
            return null;
          });
          if (!second) process.exit(0);

          const secondCount = Number(second.ratingCompleteCount || 0);
          if (secondCount > liveCount) {
            console.log(`Render is already advancing ratings: ${liveCount} -> ${secondCount}. Exiting to avoid duplicate provider usage.`);
            process.exit(0);
          }
          liveCount = secondCount;

          const companies = Array.isArray(second.companies) ? second.companies : [];
          const candidates = companies
            .filter((company) =>
              company &&
              company.ticker &&
              company.hasRating !== true &&
              company.hasSecIdentity === true &&
              company.hasFilings === true &&
              company.hasFacts === true
            )
            .sort((left, right) => {
              const leftTicker = String(left.ticker).trim().toUpperCase();
              const rightTicker = String(right.ticker).trim().toUpperCase();
              const leftRank = priorityRank.get(leftTicker) ?? Number.MAX_SAFE_INTEGER;
              const rightRank = priorityRank.get(rightTicker) ?? Number.MAX_SAFE_INTEGER;
              if (leftRank !== rightRank) return leftRank - rightRank;
              return 0;
            })
            .slice(0, maxCandidates);

          const priorityCandidates = candidates.filter((company) =>
            priorityRank.has(String(company.ticker).trim().toUpperCase())
          );
          console.log(
            `GitHub worker taking over with ${candidates.length} candidates from ${companies.length} returned companies; ` +
            `${priorityCandidates.length} protected strategic candidates are scheduled first.`,
          );

          let attempted = 0;
          let ratedThisRun = 0;
          let skipped = 0;
          let consecutiveProviderStops = 0;
          let consecutiveRouteMisses = 0;

          for (const company of candidates) {
            if (liveCount >= target) break;
            const ticker = String(company.ticker).trim().toUpperCase();
            if (!ticker) continue;

            attempted += 1;
            let result;
            try {
              result = await getJson(`${base}/api/ratings/${encodeURIComponent(ticker)}`);
            } catch (error) {
              console.log(`[network] ${ticker}: ${error instanceof Error ? error.message : String(error)}`);
              consecutiveProviderStops += 1;
              if (consecutiveProviderStops >= 3) {
                console.log("Three consecutive provider/network stops. Ending this run safely; the next 30-minute run will resume.");
                break;
              }
              await sleep(65000);
              continue;
            }

            const { response, body } = result;
            if (response.ok && body?.eligible === true && Number.isFinite(Number(body?.score))) {
              ratedThisRun += 1;
              liveCount += 1;
              consecutiveProviderStops = 0;
              consecutiveRouteMisses = 0;
              console.log(`[rated] ${ticker} score=${body.score} estimatedComplete=${liveCount}`);
            } else if (response.status === 404) {
              consecutiveRouteMisses += 1;
              consecutiveProviderStops = 0;
              console.log(`[route-missing] ${ticker} HTTP 404; consecutive=${consecutiveRouteMisses}`);
              if (consecutiveRouteMisses >= 3) {
                console.log("Three consecutive rating-route 404s. Ending this run instead of hammering a stale Render backend.");
                break;
              }
            } else if (response.status === 429 || response.status === 503) {
              consecutiveProviderStops += 1;
              consecutiveRouteMisses = 0;
              console.log(`[provider-stop] ${ticker} HTTP ${response.status}; consecutive=${consecutiveProviderStops}`);
              if (consecutiveProviderStops >= 3) {
                console.log("Provider appears rate- or daily-quota-limited. Ending this run safely; the next 30-minute run will resume automatically.");
                break;
              }
              await sleep(65000);
              continue;
            } else {
              skipped += 1;
              consecutiveProviderStops = 0;
              consecutiveRouteMisses = 0;
              console.log(`[skip] ${ticker} HTTP ${response.status} eligible=${body?.eligible ?? null} code=${body?.eligibilityCode ?? body?.error ?? "unknown"}`);
            }

            if (attempted % 20 === 0) {
              const checkpoint = await getStatus().catch(() => null);
              if (checkpoint) {
                liveCount = Number(checkpoint.ratingCompleteCount || liveCount);
                console.log(`[checkpoint] live ratingCompleteCount=${liveCount}`);
              }
            }

            if (liveCount < target) await sleep(requestDelayMs);
          }

          const final = await getStatus().catch((error) => {
            console.log(
              `Final universe status unavailable; preserving this run's local accounting ` +
              `(${error instanceof Error ? error.message : String(error)}).`,
            );
            return null;
          });
          const finalCount = final ? Number(final.ratingCompleteCount || liveCount) : liveCount;
          console.log(JSON.stringify({
            initialRatingCompleteCount: Number(first.ratingCompleteCount || 0),
            finalRatingCompleteCount: finalCount,
            target,
            statusLimit,
            attempted,
            ratedThisRun,
            skipped,
            protectedPriorityCandidatesScheduled: priorityCandidates.length,
          }, null, 2));
          NODE
