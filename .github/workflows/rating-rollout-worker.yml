# TS: 2026-08-27 22:00 ET

name: Monster Rating rollout worker

on:
  push:
    branches: [main]
    paths:
      - "backend/src/ratings/**"
      - "backend/src/jobs/startup-rating-batch.ts"
      - "backend/src/jobs/rating-batch.ts"
      - "backend/src/database/persistence.ts"
      - "backend/src/providers/**"
      - "backend/src/sec/**"
      - "backend/src/universe/**"
      - "backend/src/policy/**"
      - "backend/src/config.ts"
      - "backend/src/app.ts"
      - "render.yaml"
      - ".github/workflows/rating-rollout-worker.yml"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-rating-rollout
  cancel-in-progress: false

jobs:
  advance-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Watch production and restart the real bulk rating job when needed
        env:
          API_BASE: https://next-years-monsters-api.onrender.com
          TARGET_COUNT: "5000"
          FIRST_MILESTONE_COUNT: "500"
          STATUS_LIMIT: "5000"
          MAX_DIRECT_FALLBACK_PER_RUN: "8"
          MAX_PROTECTED_FALLBACK_PER_RUN: "2"
          REQUEST_DELAY_MS: "20000"
          PREFLIGHT_POOL_SIZE: "192"
          POST_MILESTONE_PREFLIGHT_POOL_SIZE: "320"
          FINAL_STRETCH_PREFLIGHT_POOL_SIZE: "768"
          PREFLIGHT_CONCURRENCY: "8"
          SEC_QUALIFICATION_POOL_SIZE: "64"
          SEC_QUALIFICATION_CONCURRENCY: "4"
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE;
          const target = Number(process.env.TARGET_COUNT || 5000);
          const firstMilestone = Number(process.env.FIRST_MILESTONE_COUNT || 500);
          const statusLimit = Number(process.env.STATUS_LIMIT || 5000);
          const maxDirectFallbackPerRun = Number(process.env.MAX_DIRECT_FALLBACK_PER_RUN || 8);
          const maxProtectedFallbackPerRun = Math.max(
            Math.min(Number(process.env.MAX_PROTECTED_FALLBACK_PER_RUN || 2), maxDirectFallbackPerRun),
            0,
          );
          const requestDelayMs = Number(process.env.REQUEST_DELAY_MS || 20000);
          const preflightPoolSize = Number(process.env.PREFLIGHT_POOL_SIZE || 192);
          const postMilestonePreflightPoolSize = Number(process.env.POST_MILESTONE_PREFLIGHT_POOL_SIZE || 320);
          const finalStretchPreflightPoolSize = Number(process.env.FINAL_STRETCH_PREFLIGHT_POOL_SIZE || 768);
          const preflightConcurrency = Math.max(Number(process.env.PREFLIGHT_CONCURRENCY || 8), 1);
          const secQualificationPoolSize = Math.max(Number(process.env.SEC_QUALIFICATION_POOL_SIZE || 64), 1);
          const secQualificationConcurrency = Math.max(Number(process.env.SEC_QUALIFICATION_CONCURRENCY || 4), 1);
          const annualForms = new Set(["10-K", "10-K/A", "20-F", "20-F/A", "40-F", "40-F/A"]);
          const maxSecFactAgeMs = 7 * 24 * 60 * 60 * 1000;
          const futureToleranceMs = 5 * 60 * 1000;
          const protectedVclTickers = Object.freeze([
            "AAPL", "NVDA", "MNST", "AMZN", "TSLA",
            "NFLX", "AMD", "COST", "VRT", "AXON",
            "DECK", "WING", "META", "APP", "MSFT",
          ]);
          const protectedVclSet = new Set(protectedVclTickers);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(url, timeoutMs = 70_000) {
            const response = await fetch(url, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(timeoutMs),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function mapWithConcurrency(items, concurrency, mapper) {
            const results = new Array(items.length);
            let nextIndex = 0;
            const workers = Array.from(
              { length: Math.min(concurrency, Math.max(items.length, 1)) },
              async () => {
                while (true) {
                  const index = nextIndex;
                  nextIndex += 1;
                  if (index >= items.length) return;
                  results[index] = await mapper(items[index], index);
                }
              },
            );
            await Promise.all(workers);
            return results;
          }

          async function preflightStoredCandidate(company) {
            const ticker = String(company.ticker).trim().toUpperCase();
            try {
              const stored = await getJson(`${base}/api/stored/${encodeURIComponent(ticker)}`, 20_000);
              if (!stored.response.ok || !stored.body) {
                return { company, preflightOk: false, factCount: -1, filingCount: -1, ratingCount: 0, storedDollarVolume: null };
              }
              const storedPrice = Number(stored.body.latestQuote?.price);
              const storedVolume = Number(stored.body.latestQuote?.volume);
              const storedDollarVolume =
                Number.isFinite(storedPrice) && storedPrice > 0 && Number.isFinite(storedVolume) && storedVolume > 0
                  ? storedPrice * storedVolume
                  : null;
              return {
                company,
                preflightOk: true,
                factCount: Number(stored.body.factCount || 0),
                filingCount: Number(stored.body.filingCount || 0),
                ratingCount: Number(stored.body.ratingCount || 0),
                storedDollarVolume,
              };
            } catch {
              return { company, preflightOk: false, factCount: -1, filingCount: -1, ratingCount: 0, storedDollarVolume: null };
            }
          }

          function annualRevenuePeriodCount(summary) {
            const history = Array.isArray(summary?.history?.revenue)
              ? summary.history.revenue
              : summary?.facts?.revenue
                ? [summary.facts.revenue]
                : [];
            const fiscalYears = new Set();
            for (const fact of history) {
              if (
                fact?.fiscalPeriod !== "FY" ||
                !annualForms.has(String(fact?.form || "")) ||
                !Number.isFinite(Number(fact?.value)) ||
                !Number.isFinite(Number(fact?.fiscalYear))
              ) continue;
              fiscalYears.add(Number(fact.fiscalYear));
            }
            return fiscalYears.size;
          }

          function secFinancialEvidenceReady(summary, ticker, company) {
            if (!summary || typeof summary !== "object") return false;
            const normalizedTicker = String(summary.ticker || "").trim().toUpperCase();
            const cik = Number(summary.cik);
            const expectedCik = Number(company?.cik);
            const retrievedAtMs = Date.parse(String(summary.retrievedAt || ""));
            const nowMs = Date.now();
            const sourceUrl = String(summary.sourceUrl || "");
            const facts = summary.facts && typeof summary.facts === "object" ? summary.facts : null;
            if (normalizedTicker !== ticker) return false;
            if (!Number.isInteger(cik) || cik <= 0) return false;
            if (!sourceUrl.startsWith("https://data.sec.gov/")) return false;
            if (!facts || Object.keys(facts).length === 0) return false;
            if (!Number.isFinite(retrievedAtMs)) return false;
            const ageMs = nowMs - retrievedAtMs;
            if (ageMs < -futureToleranceMs || ageMs > maxSecFactAgeMs) return false;
            if (Number.isInteger(expectedCik) && expectedCik > 0 && expectedCik !== cik) return false;
            return true;
          }

          async function preflightSecRevenueCandidate(item) {
            const ticker = String(item.company.ticker).trim().toUpperCase();
            try {
              const facts = await getJson(`${base}/api/sec/facts/${encodeURIComponent(ticker)}`, 30_000);
              if (!facts.response.ok || !facts.body) {
                return { ...item, secQualificationOk: false, annualRevenuePeriodCount: 0, secReadinessOk: false };
              }
              const secReadinessOk = secFinancialEvidenceReady(facts.body, ticker, item.company);
              const annualRevenuePeriods = secReadinessOk ? annualRevenuePeriodCount(facts.body) : 0;
              return {
                ...item,
                secQualificationOk: secReadinessOk && annualRevenuePeriods >= 2,
                annualRevenuePeriodCount: annualRevenuePeriods,
                secReadinessOk,
              };
            } catch {
              return { ...item, secQualificationOk: false, annualRevenuePeriodCount: 0, secReadinessOk: false };
            }
          }

          let health;
          let universe;
          let startup;
          try {
            [health, universe, startup] = await Promise.all([
              getJson(`${base}/api/health`),
              getJson(`${base}/api/universe/status?limit=${statusLimit}`),
              getJson(`${base}/api/startup-status`),
            ]);
          } catch (error) {
            console.log(`Rating watchdog could not reach production: ${error instanceof Error ? error.message : String(error)}`);
            process.exit(0);
          }

          const count = Number(universe.body?.ratingCompleteCount || 0);
          const remainingCount = Math.max(target - count, 0);
          const remainingFirstMilestone = Math.max(firstMilestone - count, 0);
          const firstMilestoneReached = count >= firstMilestone;
          const milestoneAwareRemaining = firstMilestoneReached ? remainingCount : remainingFirstMilestone;
          const directFallbackBudget = Math.min(maxDirectFallbackPerRun, milestoneAwareRemaining);
          const finalStretchActive = !firstMilestoneReached && remainingFirstMilestone > 0 && remainingFirstMilestone <= 2;
          const effectivePreflightPoolSize = finalStretchActive
            ? Math.max(preflightPoolSize, finalStretchPreflightPoolSize)
            : firstMilestoneReached
              ? Math.max(preflightPoolSize, postMilestonePreflightPoolSize)
              : preflightPoolSize;
          const ratingJob = startup.body?.jobs?.ratingBatch ?? null;
          const earlierJobs = [
            startup.body?.jobs?.universeImport,
            startup.body?.jobs?.secUniverseBatch,
            startup.body?.jobs?.pilotRefresh,
          ].filter(Boolean);
          const earlierJobRunning = earlierJobs.some((job) => job?.state === "running");
          const deployHook = (process.env.RENDER_DEPLOY_HOOK_URL || "").trim();
          const apiKey = (process.env.RENDER_API_KEY || "").trim();
          const serviceId = (process.env.RENDER_SERVICE_ID || "").trim();
          const hasRenderAuthority = Boolean(deployHook || (apiKey && serviceId));

          console.log(JSON.stringify({
            ratingCompleteCount: count,
            target,
            remainingCount,
            firstMilestone,
            remainingFirstMilestone,
            firstMilestoneReached,
            directFallbackBudget,
            finalStretchActive,
            preflightPoolSize,
            postMilestonePreflightPoolSize,
            finalStretchPreflightPoolSize,
            effectivePreflightPoolSize,
            secQualificationPoolSize,
            secQualificationConcurrency,
            secEvidenceReadyCount: universe.body?.secEvidenceReadyCount ?? null,
            marketConfigured: health.body?.marketData?.configured === true,
            ratingJobState: ratingJob?.state ?? null,
            ratingJobStartedAt: ratingJob?.startedAt ?? null,
            ratingJobCompletedAt: ratingJob?.completedAt ?? null,
            ratingJobSummary: ratingJob?.summary ?? null,
            earlierJobRunning,
            hasRenderAuthority,
          }, null, 2));

          if (count >= target) {
            console.log(`Monster Rating target reached: ${count}/${target}.`);
            process.exit(0);
          }

          if (firstMilestoneReached) {
            console.log(`First Monster Rating milestone reached: ${count}/${firstMilestone}. Continuing safely toward ${target}.`);
          }

          if (health.body?.marketData?.configured !== true) {
            console.log("Rating watchdog will not restart production because the licensed market-data provider is not configured.");
            process.exit(0);
          }

          if (ratingJob?.state === "running") {
            console.log(`Bulk rating job is already running at ${count}/${target}; leave it alone and check again on the next watchdog pass.`);
            process.exit(0);
          }

          if (earlierJobRunning && hasRenderAuthority) {
            console.log("Earlier startup work is still running; do not interrupt it with another Render redeploy.");
            process.exit(0);
          }

          if (earlierJobRunning && !hasRenderAuthority) {
            console.log("Earlier startup work is still running, but no Render deployment authority exists; continue with the bounded direct rating fallback without redeploying Render.");
          }

          if (ratingJob?.state === "pending") {
            if (earlierJobRunning && !hasRenderAuthority) {
              console.log(`Bulk rating job is pending during earlier startup work at ${count}/${target}; use bounded direct fallback because Render cannot be redeployed.`);
            } else {
              console.log(`Bulk rating job is pending with no earlier startup job blocking recovery at ${count}/${target}; treat this as stalled and restart production.`);
            }
          }

          if (deployHook) {
            const response = await fetch(deployHook, {
              method: "POST",
              signal: AbortSignal.timeout(70_000),
            });
            if (!response.ok) {
              throw new Error(`Render deploy hook returned HTTP ${response.status}.`);
            }
            console.log(`Restarted Render bulk rating recovery through deploy hook at ${count}/${target}.`);
            process.exit(0);
          }

          if (apiKey && serviceId) {
            const headers = {
              Authorization: `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              Accept: "application/json",
            };
            const repair = await fetch(`https://api.render.com/v1/services/${serviceId}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ autoDeploy: "yes", branch: "main" }),
              signal: AbortSignal.timeout(70_000),
            });
            if (!repair.ok) {
              throw new Error(`Render service repair returned HTTP ${repair.status}.`);
            }
            const deploy = await fetch(`https://api.render.com/v1/services/${serviceId}/deploys`, {
              method: "POST",
              headers,
              body: JSON.stringify({ clearCache: "do_not_clear" }),
              signal: AbortSignal.timeout(70_000),
            });
            if (!deploy.ok) {
              throw new Error(`Render deploy trigger returned HTTP ${deploy.status}.`);
            }
            console.log(`Restarted Render bulk rating recovery through API at ${count}/${target}.`);
            process.exit(0);
          }

          const companies = Array.isArray(universe.body?.companies) ? universe.body.companies : [];
          const eligibleCandidates = companies.filter((company) =>
            company &&
            company.ticker &&
            company.hasRating !== true &&
            company.hasSecIdentity === true &&
            company.hasFilings === true &&
            company.hasFacts === true
          );
          const protectedCandidates = eligibleCandidates
            .filter((company) => protectedVclSet.has(String(company.ticker).trim().toUpperCase()))
            .sort((left, right) =>
              protectedVclTickers.indexOf(String(left.ticker).trim().toUpperCase()) -
              protectedVclTickers.indexOf(String(right.ticker).trim().toUpperCase())
            );
          const ordinaryCandidates = eligibleCandidates.filter(
            (company) => !protectedVclSet.has(String(company.ticker).trim().toUpperCase()),
          );
          const cohortNumber = Math.floor(Date.now() / (30 * 60 * 1000));

          const protectedPreflightResults = await mapWithConcurrency(
            protectedCandidates,
            preflightConcurrency,
            preflightStoredCandidate,
          );
          const verifiedProtectedPreflight = protectedPreflightResults.filter((item) => item.preflightOk);
          const protectedSecQualificationResults = await mapWithConcurrency(
            verifiedProtectedPreflight,
            secQualificationConcurrency,
            preflightSecRevenueCandidate,
          );
          const qualifiedProtectedCandidates = protectedSecQualificationResults
            .filter((item) => item.secQualificationOk)
            .map((item) => item.company);
          const protectedAttemptCount = Math.min(
            qualifiedProtectedCandidates.length,
            maxProtectedFallbackPerRun,
            directFallbackBudget,
          );
          const protectedStartIndex = qualifiedProtectedCandidates.length > 0
            ? cohortNumber % qualifiedProtectedCandidates.length
            : 0;
          const selectedProtectedCandidates = Array.from(
            { length: protectedAttemptCount },
            (_, index) => qualifiedProtectedCandidates[(protectedStartIndex + index) % qualifiedProtectedCandidates.length],
          );
          const ordinaryAttemptCount = Math.min(
            Math.max(directFallbackBudget - selectedProtectedCandidates.length, 0),
            ordinaryCandidates.length,
          );
          const startIndex = ordinaryCandidates.length > 0
            ? (cohortNumber * Math.max(effectivePreflightPoolSize, 1)) % ordinaryCandidates.length
            : 0;
          const preflightStride = ordinaryCandidates.length > 0
            ? Math.max(Math.floor(ordinaryCandidates.length / Math.max(effectivePreflightPoolSize, 1)), 1)
            : 1;
          const preflightPool = Array.from(
            { length: Math.min(effectivePreflightPoolSize, ordinaryCandidates.length) },
            (_, index) => ordinaryCandidates[(startIndex + index * preflightStride) % ordinaryCandidates.length],
          );
          const preflightResults = await mapWithConcurrency(
            preflightPool,
            preflightConcurrency,
            preflightStoredCandidate,
          );
          const verifiedPreflightResults = preflightResults.filter((item) => item.preflightOk);
          const rankedStoredPreflightResults = verifiedPreflightResults.sort((left, right) =>
            right.filingCount - left.filingCount ||
            right.factCount - left.factCount ||
            left.ratingCount - right.ratingCount ||
            String(left.company.ticker).localeCompare(String(right.company.ticker))
          );
          const secQualificationPool = rankedStoredPreflightResults.slice(
            0,
            Math.min(secQualificationPoolSize, rankedStoredPreflightResults.length),
          );
          const secQualificationResults = await mapWithConcurrency(
            secQualificationPool,
            secQualificationConcurrency,
            preflightSecRevenueCandidate,
          );
          const qualifiedOrdinaryCandidates = secQualificationResults
            .filter((item) => item.secQualificationOk)
            .sort((left, right) => {
              const leftLiquidity = Number.isFinite(left.storedDollarVolume) ? left.storedDollarVolume : -1;
              const rightLiquidity = Number.isFinite(right.storedDollarVolume) ? right.storedDollarVolume : -1;
              return (
                rightLiquidity - leftLiquidity ||
                right.filingCount - left.filingCount ||
                right.factCount - left.factCount ||
                String(left.company.ticker).localeCompare(String(right.company.ticker))
              );
            })
            .slice(0, ordinaryAttemptCount)
            .map((item) => item.company);
          const candidates = [
            ...selectedProtectedCandidates,
            ...qualifiedOrdinaryCandidates,
          ];

          console.log(
            `No Render deployment authority. Using bounded VCL-priority SEC-qualified quota-safe fallback for ${candidates.length} candidates ` +
            `(remaining=${remainingCount}, firstMilestoneRemaining=${remainingFirstMilestone}, budget=${directFallbackBudget}, finalStretch=${finalStretchActive}, eligible=${eligibleCandidates.length}, protected=${protectedCandidates.length}, protectedPreflighted=${protectedPreflightResults.length}, ` +
            `verifiedProtectedPreflight=${verifiedProtectedPreflight.length}, protectedSecQualified=${qualifiedProtectedCandidates.length}, protectedAttempted=${selectedProtectedCandidates.length}, protectedStartIndex=${protectedStartIndex}, ordinary=${ordinaryCandidates.length}, configuredPreflightPool=${preflightPoolSize}, postMilestonePreflightPool=${postMilestonePreflightPoolSize}, effectivePreflightPool=${effectivePreflightPoolSize}, preflighted=${preflightPool.length}, verifiedPreflight=${verifiedPreflightResults.length}, ` +
            `secQualificationPool=${secQualificationPool.length}, secQualifiedOrdinary=${qualifiedOrdinaryCandidates.length}, secQualificationConcurrency=${secQualificationConcurrency}, preflightConcurrency=${preflightConcurrency}, startIndex=${startIndex}, preflightStride=${preflightStride}) at ${count}/${target}.`,
          );

          let rated = 0;
          for (const company of candidates) {
            const ticker = String(company.ticker).trim().toUpperCase();
            if (!ticker) continue;
            try {
              const result = await getJson(`${base}/api/ratings/${encodeURIComponent(ticker)}`);
              if (result.response.ok && result.body?.eligible === true && Number.isFinite(Number(result.body?.score))) {
                rated += 1;
                console.log(`[direct-rated] ${ticker} score=${result.body.score}`);
              } else {
                const reasons = Array.isArray(result.body?.reasons) ? result.body.reasons : [];
                const code = result.body?.eligibilityCode ?? reasons[0]?.code ?? "unknown";
                const missing = reasons.flatMap((reason) => Array.isArray(reason?.missingEvidence) ? reason.missingEvidence : []);
                console.log(`[direct-skip] ${ticker} HTTP ${result.response.status} eligible=${result.body?.eligible ?? null} code=${code} missing=${JSON.stringify(missing)} reasons=${JSON.stringify(reasons)}`);
              }
            } catch (error) {
              console.log(`[direct-error] ${ticker}: ${error instanceof Error ? error.message : String(error)}`);
              break;
            }
            await sleep(requestDelayMs);
          }

          const final = await getJson(`${base}/api/universe/status?limit=${statusLimit}`).catch(() => null);
          console.log(JSON.stringify({
            directFallbackAttempted: candidates.length,
            directFallbackRated: rated,
            directFallbackEligibleCount: eligibleCandidates.length,
            directFallbackProtectedCount: protectedCandidates.length,
            directFallbackProtectedPreflightedCount: protectedPreflightResults.length,
            directFallbackVerifiedProtectedPreflightCount: verifiedProtectedPreflight.length,
            directFallbackProtectedSecQualifiedCount: qualifiedProtectedCandidates.length,
            directFallbackProtectedAttemptedCount: selectedProtectedCandidates.length,
            directFallbackProtectedStartIndex: protectedStartIndex,
            directFallbackOrdinaryCount: ordinaryCandidates.length,
            directFallbackConfiguredPreflightPoolSize: preflightPoolSize,
            directFallbackPostMilestonePreflightPoolSize: postMilestonePreflightPoolSize,
            directFallbackEffectivePreflightPoolSize: effectivePreflightPoolSize,
            directFallbackFinalStretchActive: finalStretchActive,
            directFallbackPreflightedCount: preflightPool.length,
            directFallbackVerifiedPreflightCount: verifiedPreflightResults.length,
            directFallbackSecQualificationPoolSize: secQualificationPool.length,
            directFallbackSecQualifiedOrdinaryCount: qualifiedOrdinaryCandidates.length,
            directFallbackSecQualificationConcurrency: secQualificationConcurrency,
            directFallbackPreflightConcurrency: preflightConcurrency,
            directFallbackStartIndex: startIndex,
            directFallbackPreflightStride: preflightStride,
            initialRatingCompleteCount: count,
            finalRatingCompleteCount: final ? Number(final.body?.ratingCompleteCount || count) : count,
          }, null, 2));
          NODE