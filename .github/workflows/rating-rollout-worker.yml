# TS: 2026-08-22 13:22 UTC

name: Monster Rating rollout worker

on:
  push:
    branches: [main]
    paths:
      - "backend/src/ratings/**"
      - "backend/src/jobs/startup-rating-batch.ts"
      - "backend/src/jobs/rating-batch.ts"
      - "backend/src/database/persistence.ts"
      - "backend/src/app.ts"
      - "render.yaml"
      - ".github/workflows/rating-rollout-worker.yml"
  schedule:
    - cron: "8,28,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-rating-rollout
  cancel-in-progress: true

jobs:
  advance-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watch production and restart the real bulk rating job when needed
        env:
          API_BASE: https://next-years-monsters-api.onrender.com
          TARGET_COUNT: "500"
          STATUS_LIMIT: "5000"
          MAX_DIRECT_FALLBACK_PER_RUN: "5"
          REQUEST_DELAY_MS: "20000"
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE;
          const target = Number(process.env.TARGET_COUNT || 500);
          const statusLimit = Number(process.env.STATUS_LIMIT || 5000);
          const maxDirectFallbackPerRun = Number(process.env.MAX_DIRECT_FALLBACK_PER_RUN || 5);
          const requestDelayMs = Number(process.env.REQUEST_DELAY_MS || 20000);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(url, timeoutMs = 70_000) {
            const response = await fetch(url, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(timeoutMs),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          let health;
          let universe;
          let startup;
          try {
            [health, universe, startup] = await Promise.all([
              getJson(`${base}/api/health`),
              getJson(`${base}/api/universe/status?limit=${statusLimit}`),
              getJson(`${base}/api/startup-status`),
            ]);
          } catch (error) {
            console.log(`Rating watchdog could not reach production: ${error instanceof Error ? error.message : String(error)}`);
            process.exit(0);
          }

          const count = Number(universe.body?.ratingCompleteCount || 0);
          const ratingJob = startup.body?.jobs?.ratingBatch ?? null;
          const earlierJobs = [
            startup.body?.jobs?.universeImport,
            startup.body?.jobs?.secUniverseBatch,
            startup.body?.jobs?.pilotRefresh,
          ].filter(Boolean);
          const earlierJobRunning = earlierJobs.some((job) => job?.state === "running");

          console.log(JSON.stringify({
            ratingCompleteCount: count,
            target,
            secEvidenceReadyCount: universe.body?.secEvidenceReadyCount ?? null,
            marketConfigured: health.body?.marketData?.configured === true,
            ratingJobState: ratingJob?.state ?? null,
            ratingJobStartedAt: ratingJob?.startedAt ?? null,
            ratingJobCompletedAt: ratingJob?.completedAt ?? null,
            ratingJobSummary: ratingJob?.summary ?? null,
          }, null, 2));

          if (count >= target) {
            console.log(`Monster Rating target reached: ${count}/${target}.`);
            process.exit(0);
          }

          if (health.body?.marketData?.configured !== true) {
            console.log("Rating watchdog will not restart production because the licensed market-data provider is not configured.");
            process.exit(0);
          }

          if (ratingJob?.state === "running") {
            console.log(`Bulk rating job is already running at ${count}/${target}; leave it alone and check again on the next watchdog pass.`);
            process.exit(0);
          }

          if (earlierJobRunning) {
            console.log("Earlier startup work is still running; do not interrupt it with another redeploy.");
            process.exit(0);
          }

          if (ratingJob?.state === "pending") {
            console.log(`Bulk rating job is pending with no earlier startup job running at ${count}/${target}; treat this as stalled and restart production.`);
          }

          const deployHook = (process.env.RENDER_DEPLOY_HOOK_URL || "").trim();
          const apiKey = (process.env.RENDER_API_KEY || "").trim();
          const serviceId = (process.env.RENDER_SERVICE_ID || "").trim();

          if (deployHook) {
            const response = await fetch(deployHook, {
              method: "POST",
              signal: AbortSignal.timeout(70_000),
            });
            if (!response.ok) {
              throw new Error(`Render deploy hook returned HTTP ${response.status}.`);
            }
            console.log(`Restarted Render bulk rating recovery through deploy hook at ${count}/${target}.`);
            process.exit(0);
          }

          if (apiKey && serviceId) {
            const headers = {
              Authorization: `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              Accept: "application/json",
            };
            const repair = await fetch(`https://api.render.com/v1/services/${serviceId}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ autoDeploy: "yes", branch: "main" }),
              signal: AbortSignal.timeout(70_000),
            });
            if (!repair.ok) {
              throw new Error(`Render service repair returned HTTP ${repair.status}.`);
            }
            const deploy = await fetch(`https://api.render.com/v1/services/${serviceId}/deploys`, {
              method: "POST",
              headers,
              body: JSON.stringify({ clearCache: "do_not_clear" }),
              signal: AbortSignal.timeout(70_000),
            });
            if (!deploy.ok) {
              throw new Error(`Render deploy trigger returned HTTP ${deploy.status}.`);
            }
            console.log(`Restarted Render bulk rating recovery through API at ${count}/${target}.`);
            process.exit(0);
          }

          // No Render deployment authority exists in GitHub. Keep making bounded,
          // quota-safe progress through the already-live rating route instead of
          // repeatedly diagnosing the same stall. Five candidates every 20 minutes
          // caps the fallback near 360 candidates/day; even at roughly two market-data
          // credits per unrated candidate, that stays below the 800-credit free allowance.
          // Spread each five-attempt batch across the whole eligible universe instead of
          // burning a run on five adjacent symbols that may share the same ineligibility pattern.
          const companies = Array.isArray(universe.body?.companies) ? universe.body.companies : [];
          const eligibleCandidates = companies.filter((company) =>
            company &&
            company.ticker &&
            company.hasRating !== true &&
            company.hasSecIdentity === true &&
            company.hasFilings === true &&
            company.hasFacts === true
          );
          const cohortNumber = Math.floor(Date.now() / (20 * 60 * 1000));
          const attemptCount = Math.min(maxDirectFallbackPerRun, eligibleCandidates.length);
          const startIndex = eligibleCandidates.length > 0
            ? (cohortNumber * maxDirectFallbackPerRun) % eligibleCandidates.length
            : 0;
          const stride = attemptCount > 0
            ? Math.max(Math.floor(eligibleCandidates.length / attemptCount), 1)
            : 1;
          const candidates = Array.from(
            { length: attemptCount },
            (_, index) => eligibleCandidates[(startIndex + index * stride) % eligibleCandidates.length],
          );

          console.log(
            `No Render deployment authority. Using spread direct quota-safe fallback for ${candidates.length} candidates ` +
            `(eligible=${eligibleCandidates.length}, startIndex=${startIndex}, stride=${stride}) at ${count}/${target}.`,
          );

          let rated = 0;
          for (const company of candidates) {
            const ticker = String(company.ticker).trim().toUpperCase();
            if (!ticker) continue;
            try {
              const result = await getJson(`${base}/api/ratings/${encodeURIComponent(ticker)}`);
              if (result.response.ok && result.body?.eligible === true && Number.isFinite(Number(result.body?.score))) {
                rated += 1;
                console.log(`[direct-rated] ${ticker} score=${result.body.score}`);
              } else {
                const code = result.body?.eligibilityCode ?? result.body?.reasons?.[0]?.code ?? "unknown";
                const missing = result.body?.reasons?.[0]?.missingEvidence ?? [];
                console.log(`[direct-skip] ${ticker} HTTP ${result.response.status} eligible=${result.body?.eligible ?? null} code=${code} missing=${JSON.stringify(missing)}`);
              }
            } catch (error) {
              console.log(`[direct-error] ${ticker}: ${error instanceof Error ? error.message : String(error)}`);
              break;
            }
            await sleep(requestDelayMs);
          }

          const final = await getJson(`${base}/api/universe/status?limit=${statusLimit}`).catch(() => null);
          console.log(JSON.stringify({
            directFallbackAttempted: candidates.length,
            directFallbackRated: rated,
            directFallbackEligibleCount: eligibleCandidates.length,
            directFallbackStartIndex: startIndex,
            directFallbackStride: stride,
            initialRatingCompleteCount: count,
            finalRatingCompleteCount: final ? Number(final.body?.ratingCompleteCount || count) : count,
          }, null, 2));
          NODE
