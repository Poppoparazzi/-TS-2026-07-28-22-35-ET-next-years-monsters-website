# TS: 2026-08-22 00:05 ET

name: Monster Rating rollout worker

on:
  push:
    branches: [main]
    paths:
      - "backend/src/jobs/startup-rating-batch.ts"
      - ".github/workflows/rating-rollout-worker.yml"
  schedule:
    - cron: "8,38 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monster-rating-rollout
  cancel-in-progress: true

jobs:
  advance-ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Watch production and restart the real bulk rating job when needed
        env:
          API_BASE: https://next-years-monsters-api.onrender.com
          TARGET_COUNT: "500"
          STATUS_LIMIT: "5000"
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.API_BASE;
          const target = Number(process.env.TARGET_COUNT || 500);
          const statusLimit = Number(process.env.STATUS_LIMIT || 5000);

          async function getJson(url, timeoutMs = 70_000) {
            const response = await fetch(url, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(timeoutMs),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          let health;
          let universe;
          let startup;
          try {
            [health, universe, startup] = await Promise.all([
              getJson(`${base}/api/health`),
              getJson(`${base}/api/universe/status?limit=${statusLimit}`),
              getJson(`${base}/api/startup-status`),
            ]);
          } catch (error) {
            console.log(`Rating watchdog could not reach production: ${error instanceof Error ? error.message : String(error)}`);
            process.exit(0);
          }

          const count = Number(universe.body?.ratingCompleteCount || 0);
          const ratingJob = startup.body?.jobs?.ratingBatch ?? null;
          const earlierJobs = [
            startup.body?.jobs?.universeImport,
            startup.body?.jobs?.secUniverseBatch,
            startup.body?.jobs?.pilotRefresh,
          ].filter(Boolean);
          const earlierJobRunning = earlierJobs.some((job) => job?.state === "running");

          console.log(JSON.stringify({
            ratingCompleteCount: count,
            target,
            secEvidenceReadyCount: universe.body?.secEvidenceReadyCount ?? null,
            marketConfigured: health.body?.marketData?.configured === true,
            ratingJobState: ratingJob?.state ?? null,
            ratingJobStartedAt: ratingJob?.startedAt ?? null,
            ratingJobCompletedAt: ratingJob?.completedAt ?? null,
            ratingJobSummary: ratingJob?.summary ?? null,
          }, null, 2));

          if (count >= target) {
            console.log(`Monster Rating target reached: ${count}/${target}.`);
            process.exit(0);
          }

          if (health.body?.marketData?.configured !== true) {
            console.log("Rating watchdog will not restart production because the licensed market-data provider is not configured.");
            process.exit(0);
          }

          if (ratingJob?.state === "running") {
            console.log(`Bulk rating job is already running at ${count}/${target}; leave it alone and check again on the next watchdog pass.`);
            process.exit(0);
          }

          if (ratingJob?.state === "pending" || earlierJobRunning) {
            console.log("Startup work is still progressing toward the bulk rating job; do not interrupt it with another redeploy.");
            process.exit(0);
          }

          const deployHook = (process.env.RENDER_DEPLOY_HOOK_URL || "").trim();
          const apiKey = (process.env.RENDER_API_KEY || "").trim();
          const serviceId = (process.env.RENDER_SERVICE_ID || "").trim();

          if (deployHook) {
            const response = await fetch(deployHook, {
              method: "POST",
              signal: AbortSignal.timeout(70_000),
            });
            if (!response.ok) {
              throw new Error(`Render deploy hook returned HTTP ${response.status}.`);
            }
            console.log(`Restarted Render bulk rating recovery through deploy hook at ${count}/${target}.`);
            process.exit(0);
          }

          if (apiKey && serviceId) {
            const headers = {
              Authorization: `Bearer ${apiKey}`,
              "Content-Type": "application/json",
              Accept: "application/json",
            };
            const repair = await fetch(`https://api.render.com/v1/services/${serviceId}`, {
              method: "PATCH",
              headers,
              body: JSON.stringify({ autoDeploy: "yes", branch: "main" }),
              signal: AbortSignal.timeout(70_000),
            });
            if (!repair.ok) {
              throw new Error(`Render service repair returned HTTP ${repair.status}.`);
            }
            const deploy = await fetch(`https://api.render.com/v1/services/${serviceId}/deploys`, {
              method: "POST",
              headers,
              body: JSON.stringify({ clearCache: "do_not_clear" }),
              signal: AbortSignal.timeout(70_000),
            });
            if (!deploy.ok) {
              throw new Error(`Render deploy trigger returned HTTP ${deploy.status}.`);
            }
            console.log(`Restarted Render bulk rating recovery through API at ${count}/${target}.`);
            process.exit(0);
          }

          console.log(`Bulk rating job is not running and the count is ${count}/${target}, but this workflow has no Render deployment authority.`);
          NODE
