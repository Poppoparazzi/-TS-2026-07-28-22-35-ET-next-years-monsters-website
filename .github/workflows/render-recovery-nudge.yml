# TS: 2026-08-22 03:28 ET

name: Render recovery nudge

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/render-redeploy-recovery.yml"
      - ".github/workflows/render-recovery-nudge.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch existing Render recovery watchdog now
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run render-redeploy-recovery.yml --ref main
