# TS: 2026-08-16 21:31 ET

name: Current Stock Rating production smoke (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-stock-rating-production-smoke
  cancel-in-progress: true

jobs:
  verify-rating-path:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify AAPL, CRDO, RKLB, and MSFT production rating path
        env:
          NYM_RATING_SMOKE_SYMBOLS: "AAPL,CRDO,RKLB,MSFT"
          NYM_EXPECTED_RATING_ENGINE: "nym-current-stock-rating-v0.1-readiness-only"
          NYM_ALLOW_KNOWN_STALE_BLOCKED: "1"
          NYM_RATING_SMOKE_ATTEMPTS: "1"
          NYM_RATING_SMOKE_DELAY_MS: "0"
        run: node scripts/verify-rating-path.mjs
