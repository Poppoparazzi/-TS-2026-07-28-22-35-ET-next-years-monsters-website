# TS: 2026-08-16 21:31 ET

name: Render deployment diagnostic (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record stability-mode boundary
        run: |
          {
            echo "### Render stability mode"
            echo
            echo "Automatic Render redeploy/recovery attempts are disabled."
            echo "This diagnostic runs only when a person explicitly starts it."
            echo
            echo "Reason: the production backend is a known deployment/configuration blocker, and repeated automatic retries were creating noise without deployment authority."
            echo
            echo "See RENDER_DEPLOYMENT_REQUIRED.md before attempting a production redeploy."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Probe current Render startup status without failing the repository
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 75 \
            https://next-years-monsters-api.onrender.com/api/startup-status || true
