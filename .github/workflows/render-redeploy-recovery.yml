# TS: 2026-08-25 06:02 ET

name: Render deploy recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: render-deploy-recovery
  cancel-in-progress: false

jobs:
  recover-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Classify current Render deployment state
        id: render_state
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { resolveBackendDeployTarget } from "./scripts/resolve-backend-deploy-target.mjs";

          const base = "https://next-years-monsters-api.onrender.com";
          const latestRelevantCommit = resolveBackendDeployTarget();

          let startupHttpStatus = null;
          let startupError = null;
          let deployedCommit = null;
          let classification = "unknown";
          let relevantChangesAfterDeploy = null;
          let marketConfigured = false;
          let ratingCompleteCount = null;
          let ratingBatchAgeHours = null;
          let ratingProtectedMustRepairCount = null;

          function isAncestor(ancestor, descendant) {
            try {
              execFileSync("git", ["merge-base", "--is-ancestor", ancestor, descendant], { stdio: "ignore" });
              return true;
            } catch {
              return false;
            }
          }

          try {
            const startupResponse = await fetch(`${base}/api/startup-status`, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(70_000),
            });
            startupHttpStatus = startupResponse.status;
            const startup = await startupResponse.json().catch(() => null);
            deployedCommit = startup?.deployment?.commit ?? startup?.deploymentCommit ?? null;

            if (deployedCommit) {
              try {
                execFileSync("git", ["cat-file", "-e", `${deployedCommit}^{commit}`], { stdio: "ignore" });
                const targetAlreadyDeployed = isAncestor(latestRelevantCommit, deployedCommit);
                const targetAheadOfDeploy = isAncestor(deployedCommit, latestRelevantCommit);

                if (targetAlreadyDeployed) {
                  relevantChangesAfterDeploy = 0;
                  classification = "current_for_backend";
                } else if (targetAheadOfDeploy) {
                  relevantChangesAfterDeploy = 1;
                  classification = "stale_deployment";
                } else {
                  classification = "deployed_commit_not_in_repository_history";
                }

                if (classification === "current_for_backend") {
                  const [healthResponse, universeResponse] = await Promise.all([
                    fetch(`${base}/api/health`, {
                      headers: { Accept: "application/json" },
                      signal: AbortSignal.timeout(70_000),
                    }),
                    fetch(`${base}/api/universe/status?limit=5000`, {
                      headers: { Accept: "application/json" },
                      signal: AbortSignal.timeout(70_000),
                    }),
                  ]);
                  const health = await healthResponse.json().catch(() => null);
                  const universe = await universeResponse.json().catch(() => null);
                  marketConfigured = health?.marketData?.configured === true;
                  ratingCompleteCount = Number.isInteger(Number(universe?.ratingCompleteCount))
                    ? Number(universe.ratingCompleteCount)
                    : null;
                  const ratingJob = startup?.jobs?.ratingBatch;
                  const ratingCompletedAt = Date.parse(String(ratingJob?.completedAt ?? ""));
                  ratingBatchAgeHours = Number.isFinite(ratingCompletedAt)
                    ? (Date.now() - ratingCompletedAt) / (60 * 60 * 1000)
                    : null;
                  ratingProtectedMustRepairCount = Number.isInteger(
                    Number(ratingJob?.summary?.protectedMustRepairCount),
                  ) ? Number(ratingJob.summary.protectedMustRepairCount) : null;

                  if (marketConfigured && (
                    ratingCompleteCount === null || ratingCompleteCount < 500 ||
                    ratingBatchAgeHours === null || ratingBatchAgeHours >= 20 ||
                    (ratingProtectedMustRepairCount ?? 0) > 0
                  )) {
                    classification = "rating_recovery_required";
                  }
                }
              } catch {
                classification = "deployed_commit_not_in_repository_history";
              }
            } else if (!startupResponse.ok) {
              classification = "render_unhealthy";
            }
          } catch (error) {
            startupError = error instanceof Error ? error.message : String(error);
            classification = "render_unreachable";
          }

          console.log("Render deployment diagnostic:");
          console.log(JSON.stringify({
            startupHttpStatus,
            startupError,
            deployedCommit,
            latestRelevantCommit,
            relevantChangesAfterDeploy,
            marketConfigured,
            ratingCompleteCount,
            ratingBatchAgeHours,
            ratingProtectedMustRepairCount,
            classification,
          }, null, 2));

          if (classification === "render_unreachable") {
            console.log("Render could not be reached for classification; continue to credential detection so an authorized recovery can still run.");
          }

          if (process.env.GITHUB_OUTPUT) {
            const fs = await import("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `classification=${classification}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployed_commit=${deployedCommit ?? ""}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latest_relevant_commit=${latestRelevantCommit}\n`);
          }
          NODE

      - name: Detect exact Render and Vercel deployment authority
        id: render_auth
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/report-deployment-authority.mjs

      - name: Persist exact deployment authority state artifact
        uses: actions/upload-artifact@v4
        with:
          name: nym-deployment-authority-state
          path: ${{ steps.render_auth.outputs.authority_state_file || 'nym-deployment-authority.json' }}
          if-no-files-found: warn
          retention-days: 30

      - name: Trigger Render deployment through deploy hook
        if: steps.render_auth.outputs.method == 'deploy_hook' && steps.render_state.outputs.classification != 'current_for_backend'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Restore Render branch and auto-deploy through API
        if: steps.render_auth.outputs.method == 'api' && steps.render_state.outputs.classification != 'current_for_backend'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"autoDeploy":"yes","branch":"main"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render API service repair returned HTTP $status" >&2
            exit 1
          fi

      - name: Trigger Render deployment through API
        if: steps.render_auth.outputs.method == 'api' && steps.render_state.outputs.classification != 'current_for_backend'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render API deploy trigger returned HTTP $status" >&2
            exit 1
          fi

      - name: Verify backend and AAPL rating route
        env:
          RECOVERY_METHOD: ${{ steps.render_auth.outputs.method }}
          INITIAL_CLASSIFICATION: ${{ steps.render_state.outputs.classification }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://next-years-monsters-api.onrender.com";
          const recoveryMethod = process.env.RECOVERY_METHOD || "none";
          const initialClassification = process.env.INITIAL_CLASSIFICATION || "unknown";
          const shouldWaitForDeploy = recoveryMethod !== "none" && initialClassification !== "current_for_backend";
          const attempts = shouldWaitForDeploy ? 12 : 1;
          const delayMs = 30_000;

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const [startupResponse, ratingResponse] = await Promise.all([
                fetch(`${base}/api/startup-status`, {
                  headers: { Accept: "application/json" },
                  signal: AbortSignal.timeout(70_000),
                }),
                fetch(`${base}/api/ratings/AAPL`, {
                  headers: { Accept: "application/json" },
                  signal: AbortSignal.timeout(70_000),
                }),
              ]);

              const startup = await startupResponse.json().catch(() => null);
              const rating = await ratingResponse.json().catch(() => null);
              console.log(JSON.stringify({
                attempt,
                recoveryMethod,
                deployedCommit: startup?.deployment?.commit ?? startup?.deploymentCommit ?? null,
                ratingStatus: ratingResponse.status,
                ratingSymbol: rating?.symbol ?? null,
                ratingScore: rating?.score ?? null,
              }));

              const ratingIsTruthful = ratingResponse.ok && rating?.symbol === "AAPL" && (
                (rating?.eligible === true && typeof rating?.score === "number" && rating.score >= 0 && rating.score <= 100) ||
                (rating?.eligible === false && rating?.score === null && rating?.tier === "NOT YET RATED")
              );
              if (ratingIsTruthful) {
                console.log(rating.eligible
                  ? "Render rating route is live with a verified numeric Monster Rating."
                  : "Render rating route is live and honestly marked Not Yet Rated.");
                process.exit(0);
              }
            } catch (error) {
              console.log(JSON.stringify({
                attempt,
                recoveryMethod,
                verificationError: error instanceof Error ? error.message : String(error),
              }));

              if (recoveryMethod === "none") {
                if (initialClassification === "current_for_backend") {
                  throw new Error("Render reports current backend code, but /api/ratings/AAPL could not be verified.");
                }
                console.log("Render verification is unreachable and no deployment authority exists; preserve the exact blocker and continue the watchdog.");
                process.exit(0);
              }
            }

            if (attempt < attempts) {
              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }
          }

          if (initialClassification === "current_for_backend") {
            throw new Error("Render reports current backend code, but /api/ratings/AAPL is still not healthy.");
          }

          if (recoveryMethod === "none") {
            console.log("Render remains blocked by missing deployment authority; unchanged blocker is informational, not a workflow failure.");
            process.exit(0);
          }

          throw new Error("Authorized Render recovery did not expose the repaired /api/ratings/AAPL route within the verification window.");
          NODE

      - name: Record blocked production verification without duplicate failures
        if: steps.render_state.outputs.classification != 'current_for_backend' && steps.render_auth.outputs.method == 'none'
        env:
          RENDER_CLASSIFICATION: ${{ steps.render_state.outputs.classification }}
        run: |
          {
            echo "### Production verification deferred"
            echo
            echo "Render classification: **$RENDER_CLASSIFICATION**."
            echo "No deployment authority exists, so production-only smoke/accounting/backfill checks are deferred rather than repeatedly failing on the same known stale or unreachable backend."
            echo "Frozen functional invariants still run every hour, and the recovery will resume production checks immediately when Render becomes current or deployment authority appears."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Current Stock Rating production smoke in the same hourly job
        if: steps.render_state.outputs.classification == 'current_for_backend' || steps.render_auth.outputs.method != 'none'
        env:
          NYM_RATING_SMOKE_SYMBOLS: "AAPL,CRDO,RKLB,MSFT"
          NYM_EXPECTED_RATING_ENGINE: "nym-current-stock-rating-v1.0.0"
          NYM_ALLOW_KNOWN_STALE_BLOCKED: "1"
          NYM_RATING_SMOKE_ATTEMPTS: "1"
          NYM_RATING_SMOKE_DELAY_MS: "0"
        run: node scripts/verify-rating-path.mjs

      - name: Verify frozen functional invariants without changing visuals
        run: |
          node scripts/validate-static-site.mjs
          node scripts/verify-frozen-functional-invariants.mjs

      - name: Verify production accounting and provider truth
        if: steps.render_state.outputs.classification == 'current_for_backend' || steps.render_auth.outputs.method != 'none'
        run: node scripts/verify-production.mjs

      - name: Verify 2,200 SEC evidence-ready production target
        id: evidence_ready
        continue-on-error: true
        if: steps.render_state.outputs.classification == 'current_for_backend' || steps.render_auth.outputs.method != 'none'
        env:
          NYM_UNIVERSE_STATUS_LIMIT: "5000"
          NYM_EXPECTED_USABLE_TARGET: "2200"
        run: node scripts/verify-sec-evidence-readiness.mjs

      - name: Persist SEC evidence-ready recovery state artifact
        if: steps.evidence_ready.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: nym-sec-evidence-ready-state
          path: ${{ steps.evidence_ready.outputs.recovery_state_file || 'nym-recovery-state.json' }}
          if-no-files-found: warn
          retention-days: 30

      - name: Report 5,000-candidate reserve/backfill progress toward 2,200 usable
        if: steps.render_state.outputs.classification == 'current_for_backend' || steps.render_auth.outputs.method != 'none'
        env:
          NYM_CANDIDATE_TARGET: "5000"
          NYM_USABLE_TARGET: "2200"
        run: node scripts/report-reserve-backfill.mjs

      - name: Classify SEC exceptions for repair versus replacement
        id: sec_exceptions
        if: steps.render_state.outputs.classification == 'current_for_backend' || steps.render_auth.outputs.method != 'none'
        env:
          NYM_CANDIDATE_TARGET: "5000"
          NYM_USABLE_TARGET: "2200"
        run: node scripts/report-sec-exceptions.mjs

      - name: Persist exact SEC exception roster artifact
        if: steps.sec_exceptions.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: nym-sec-exception-roster
          path: ${{ steps.sec_exceptions.outputs.exception_state_file || 'nym-sec-exceptions.json' }}
          if-no-files-found: warn
          retention-days: 30

      - name: Detect Vercel collateral authority
        id: vercel_auth
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Vercel collateral deployment authority is available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not configured; collateral deployment remains blocked."
            {
              echo "### Vercel collateral blocked"
              echo
              echo "No collateral deployment was dispatched because **VERCEL_TOKEN** is missing."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check whether current main already has a verified Vercel collateral run
        id: vercel_state
        if: steps.vercel_auth.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs_json="$(gh api "/repos/$REPOSITORY/actions/workflows/deploy-vercel-bypass.yml/runs?branch=main&status=success&per_page=20")"
          if printf '%s' "$runs_json" | jq -e --arg sha "$CURRENT_SHA" '.workflow_runs[] | select(.head_sha == $sha)' >/dev/null; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "A successful Vercel collateral workflow already exists for current main ($CURRENT_SHA); no duplicate deployment will be dispatched."
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
            echo "No successful Vercel collateral workflow exists for current main ($CURRENT_SHA)."
          fi

      - name: Dispatch prepared Vercel collateral workflow when authorized and not yet verified
        if: steps.vercel_auth.outputs.available == 'true' && steps.vercel_state.outputs.verified != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run deploy-vercel-bypass.yml --repo "$REPOSITORY" --ref main
          echo "Dispatched prepared Vercel collateral link/build/deploy/verify workflow."
          {
            echo "### Vercel collateral dispatched"
            echo
            echo "VERCEL_TOKEN is available, so the prepared collateral workflow was dispatched for current main."
          } >> "$GITHUB_STEP_SUMMARY"
