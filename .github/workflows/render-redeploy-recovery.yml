# TS: 2026-08-13 21:59 ET

name: Render deploy recovery

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "render.yaml"
      - ".github/workflows/render-redeploy-recovery.yml"

permissions:
  contents: read

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify current Render deployment state
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const base = "https://next-years-monsters-api.onrender.com";
          const startupResponse = await fetch(`${base}/api/startup-status`, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(70_000),
          });
          const startup = await startupResponse.json().catch(() => null);
          const deployedCommit = startup?.deploymentCommit ?? null;
          const latestRelevantCommit = execFileSync(
            "git",
            ["rev-list", "-1", "HEAD", "--", "backend", "render.yaml"],
            { encoding: "utf8" },
          ).trim();

          let classification = "unknown";
          let relevantChangesAfterDeploy = null;

          if (deployedCommit) {
            try {
              const changed = execFileSync(
                "git",
                ["diff", "--name-only", `${deployedCommit}..HEAD`, "--", "backend", "render.yaml"],
                { encoding: "utf8" },
              )
                .trim()
                .split("\n")
                .filter(Boolean);
              relevantChangesAfterDeploy = changed.length;
              classification = changed.length > 0 ? "stale_deployment" : "current_for_backend";
            } catch {
              classification = "deployed_commit_not_in_repository_history";
            }
          }

          console.log("Render deployment diagnostic:");
          console.log(JSON.stringify({
            startupHttpStatus: startupResponse.status,
            deployedCommit,
            latestRelevantCommit,
            relevantChangesAfterDeploy,
            classification,
          }, null, 2));

          if (classification === "stale_deployment") {
            console.log("Render is serving an older backend than the repository currently contains.");
            console.log("If a specific commit was manually deployed, Render may have disabled auto-deploy; the recovery paths below can force the latest connected-branch deploy without inventing application data.");
          }
          NODE

      - name: Detect available Render recovery credentials
        id: render_auth
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "method=deploy_hook" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook is available."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "method=api" >> "$GITHUB_OUTPUT"
            echo "Render API credentials are available."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "No Render deploy hook or API credential pair is configured. Continuing with live production verification only."
          fi

      - name: Trigger Render deployment through deploy hook
        if: steps.render_auth.outputs.method == 'deploy_hook'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Trigger Render deployment through API
        if: steps.render_auth.outputs.method == 'api'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render API deploy trigger returned HTTP $status" >&2
            exit 1
          fi
          echo "Render API accepted the deployment request with HTTP $status."

      - name: Verify backend advanced and rating route exists
        run: |
          node --input-type=module <<'NODE'
          const base = "https://next-years-monsters-api.onrender.com";
          const expectedRoute = `${base}/api/ratings/AAPL`;
          const attempts = 12;
          const delayMs = 30_000;

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            const [startupResponse, ratingResponse] = await Promise.all([
              fetch(`${base}/api/startup-status`, {
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(70_000),
              }),
              fetch(expectedRoute, {
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(70_000),
              }),
            ]);

            const startup = await startupResponse.json().catch(() => null);
            const rating = await ratingResponse.json().catch(() => null);
            const deployedCommit = startup?.deploymentCommit ?? null;

            console.log(JSON.stringify({
              attempt,
              deployedCommit,
              ratingStatus: ratingResponse.status,
              ratingEngine: rating?.engineVersion ?? null,
              ratingTier: rating?.tier ?? null,
              ratingEligibilityCode: rating?.eligibilityCode ?? null,
            }));

            if (ratingResponse.ok && rating?.symbol === "AAPL" && rating?.score === null) {
              console.log("Render rating route is live and failing closed as intended.");
              process.exit(0);
            }

            if (attempt < attempts) {
              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }
          }

          throw new Error("Render did not expose the repaired rating route within the verification window.");
          NODE
