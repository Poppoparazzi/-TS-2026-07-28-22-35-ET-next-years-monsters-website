# TS: 2026-08-17 02:00 UTC

name: Render deploy recovery

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: read

jobs:
  recover-render:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify current Render deployment state
        id: render_state
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const base = "https://next-years-monsters-api.onrender.com";
          const startupResponse = await fetch(`${base}/api/startup-status`, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(70_000),
          });
          const startup = await startupResponse.json().catch(() => null);
          const deployedCommit = startup?.deploymentCommit ?? null;
          const latestRelevantCommit = execFileSync(
            "git",
            ["rev-list", "-1", "HEAD", "--", "backend", "render.yaml"],
            { encoding: "utf8" },
          ).trim();

          let classification = "unknown";
          let relevantChangesAfterDeploy = null;

          if (deployedCommit) {
            try {
              const changed = execFileSync(
                "git",
                ["diff", "--name-only", `${deployedCommit}..HEAD`, "--", "backend", "render.yaml"],
                { encoding: "utf8" },
              )
                .trim()
                .split("\n")
                .filter(Boolean);
              relevantChangesAfterDeploy = changed.length;
              classification = changed.length > 0 ? "stale_deployment" : "current_for_backend";
            } catch {
              classification = "deployed_commit_not_in_repository_history";
            }
          }

          console.log("Render deployment diagnostic:");
          console.log(JSON.stringify({
            startupHttpStatus: startupResponse.status,
            deployedCommit,
            latestRelevantCommit,
            relevantChangesAfterDeploy,
            classification,
          }, null, 2));

          if (process.env.GITHUB_OUTPUT) {
            const fs = await import("node:fs");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `classification=${classification}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployed_commit=${deployedCommit ?? ""}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `latest_relevant_commit=${latestRelevantCommit}\n`);
          }
          NODE

      - name: Detect available Render recovery credentials
        id: render_auth
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "method=deploy_hook" >> "$GITHUB_OUTPUT"
            echo "Render deploy hook is available."
          elif [ -n "$RENDER_API_KEY" ] && [ -n "$RENDER_SERVICE_ID" ]; then
            echo "method=api" >> "$GITHUB_OUTPUT"
            echo "Render API credentials are available."
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "No Render deploy hook or API credential pair is configured."
            {
              echo "### Render recovery blocked"
              echo
              echo "No deployment was attempted because deployment authority is still missing."
              echo
              echo "Provide either **RENDER_DEPLOY_HOOK_URL** or both **RENDER_API_KEY** and **RENDER_SERVICE_ID**."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Trigger Render deployment through deploy hook
        if: steps.render_auth.outputs.method == 'deploy_hook' && steps.render_state.outputs.classification != 'current_for_backend'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK_URL"

      - name: Restore Render branch and auto-deploy through API
        if: steps.render_auth.outputs.method == 'api' && steps.render_state.outputs.classification != 'current_for_backend'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"autoDeploy":"yes","branch":"main"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID")"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render API service repair returned HTTP $status" >&2
            exit 1
          fi

      - name: Trigger Render deployment through API
        if: steps.render_auth.outputs.method == 'api' && steps.render_state.outputs.classification != 'current_for_backend'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --request POST \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          cat "$response_file"
          echo
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Render API deploy trigger returned HTTP $status" >&2
            exit 1
          fi

      - name: Verify backend and AAPL rating route
        env:
          RECOVERY_METHOD: ${{ steps.render_auth.outputs.method }}
          INITIAL_CLASSIFICATION: ${{ steps.render_state.outputs.classification }}
        run: |
          node --input-type=module <<'NODE'
          const base = "https://next-years-monsters-api.onrender.com";
          const recoveryMethod = process.env.RECOVERY_METHOD || "none";
          const initialClassification = process.env.INITIAL_CLASSIFICATION || "unknown";
          const shouldWaitForDeploy = recoveryMethod !== "none" && initialClassification !== "current_for_backend";
          const attempts = shouldWaitForDeploy ? 12 : 1;
          const delayMs = 30_000;

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            const [startupResponse, ratingResponse] = await Promise.all([
              fetch(`${base}/api/startup-status`, {
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(70_000),
              }),
              fetch(`${base}/api/ratings/AAPL`, {
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(70_000),
              }),
            ]);

            const startup = await startupResponse.json().catch(() => null);
            const rating = await ratingResponse.json().catch(() => null);
            console.log(JSON.stringify({
              attempt,
              recoveryMethod,
              deployedCommit: startup?.deploymentCommit ?? null,
              ratingStatus: ratingResponse.status,
              ratingSymbol: rating?.symbol ?? null,
              ratingScore: rating?.score ?? null,
            }));

            if (ratingResponse.ok && rating?.symbol === "AAPL" && rating?.score === null) {
              console.log("Render rating route is live and failing closed as intended.");
              process.exit(0);
            }

            if (attempt < attempts) {
              await new Promise((resolve) => setTimeout(resolve, delayMs));
            }
          }

          if (recoveryMethod === "none") {
            console.log("Render remains blocked by missing deployment authority; unchanged blocker is informational, not a workflow failure.");
            process.exit(0);
          }

          if (initialClassification === "current_for_backend") {
            throw new Error("Render reports current backend code, but /api/ratings/AAPL is still not healthy.");
          }

          throw new Error("Authorized Render recovery did not expose the repaired /api/ratings/AAPL route within the verification window.");
          NODE
