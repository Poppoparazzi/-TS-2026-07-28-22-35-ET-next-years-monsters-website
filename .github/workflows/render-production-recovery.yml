# TS: 2026-09-02 08:00 ET

name: Render production recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-production-recovery.yml"
      - "backend/**"
      - "render.yaml"
  schedule:
    - cron: "18,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production-recovery
  cancel-in-progress: false

jobs:
  recover-render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Recover stale or unreachable Render production when authorized
        env:
          API_BASE: https://next-years-monsters-api.onrender.com
          SOURCE_COMMIT: ${{ github.sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = String(process.env.API_BASE || "").replace(/\/$/, "");
          const sourceCommit = String(process.env.SOURCE_COMMIT || "").trim();
          const deployHook = String(process.env.RENDER_DEPLOY_HOOK_URL || "").trim();
          const apiKey = String(process.env.RENDER_API_KEY || "").trim();
          const serviceId = String(process.env.RENDER_SERVICE_ID || "").trim();
          const hasApiAuthority = Boolean(apiKey && serviceId);
          const hasRenderAuthority = Boolean(deployHook || hasApiAuthority);
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(path, timeoutMs = 20_000) {
            const response = await fetch(`${base}${path}`, {
              headers: { Accept: "application/json" },
              signal: AbortSignal.timeout(timeoutMs),
            });
            const body = await response.json().catch(() => null);
            return { response, body };
          }

          async function readStartup() {
            try {
              const result = await getJson("/api/startup-status");
              return {
                reachable: result.response.ok,
                status: result.response.status,
                body: result.body,
                commit: String(result.body?.deployment?.commit || "").trim() || null,
              };
            } catch (error) {
              return {
                reachable: false,
                status: null,
                body: null,
                commit: null,
                error: error instanceof Error ? error.message : String(error),
              };
            }
          }

          async function verifyAapl() {
            try {
              const result = await getJson("/api/ratings/AAPL", 45_000);
              console.log(JSON.stringify({
                aaplStatus: result.response.status,
                aaplEligible: result.body?.eligible ?? null,
                aaplEligibilityCode: result.body?.eligibilityCode ?? null,
                aaplTier: result.body?.tier ?? null,
              }));
              return result.response.ok;
            } catch (error) {
              console.log(JSON.stringify({
                aaplStatus: null,
                aaplVerificationError: error instanceof Error ? error.message : String(error),
              }));
              return false;
            }
          }

          async function triggerDeploy() {
            if (deployHook) {
              const response = await fetch(deployHook, {
                method: "POST",
                signal: AbortSignal.timeout(70_000),
              });
              if (!response.ok) throw new Error(`Render deploy hook returned HTTP ${response.status}.`);
              console.log("Triggered Render deploy through deploy hook.");
              return;
            }

            if (hasApiAuthority) {
              const headers = {
                Authorization: `Bearer ${apiKey}`,
                "Content-Type": "application/json",
                Accept: "application/json",
              };
              const repair = await fetch(`https://api.render.com/v1/services/${serviceId}`, {
                method: "PATCH",
                headers,
                body: JSON.stringify({ autoDeploy: "yes", branch: "main" }),
                signal: AbortSignal.timeout(70_000),
              });
              if (!repair.ok) throw new Error(`Render service repair returned HTTP ${repair.status}.`);

              const deploy = await fetch(`https://api.render.com/v1/services/${serviceId}/deploys`, {
                method: "POST",
                headers,
                body: JSON.stringify({ clearCache: "do_not_clear" }),
                signal: AbortSignal.timeout(70_000),
              });
              if (!deploy.ok) throw new Error(`Render deploy trigger returned HTTP ${deploy.status}.`);
              console.log("Triggered Render deploy through API authority.");
              return;
            }

            throw new Error("Render deployment authority is unavailable.");
          }

          const initial = await readStartup();
          console.log(JSON.stringify({
            sourceCommit,
            productionReachable: initial.reachable,
            startupStatus: initial.status,
            deployedCommit: initial.commit,
            staleDeployment: initial.commit !== sourceCommit,
            renderDeployHookAvailable: Boolean(deployHook),
            renderApiAuthorityAvailable: hasApiAuthority,
          }, null, 2));

          if (initial.reachable && initial.commit === sourceCommit) {
            const aaplOk = await verifyAapl();
            if (!aaplOk) process.exitCode = 1;
            process.exit();
          }

          if (!hasRenderAuthority) {
            console.log("Render production is stale or unreachable, but no deployment authority is available. No deploy attempted.");
            process.exit();
          }

          await triggerDeploy();

          let verified = null;
          for (let attempt = 1; attempt <= 20; attempt += 1) {
            await sleep(attempt === 1 ? 20_000 : 30_000);
            const startup = await readStartup();
            console.log(JSON.stringify({
              deployVerificationAttempt: attempt,
              productionReachable: startup.reachable,
              startupStatus: startup.status,
              deployedCommit: startup.commit,
              expectedCommit: sourceCommit,
            }));
            if (startup.reachable && startup.commit === sourceCommit) {
              verified = startup;
              break;
            }
          }

          if (!verified) {
            throw new Error(`Render did not report deployed commit ${sourceCommit} within the bounded verification window.`);
          }

          const aaplOk = await verifyAapl();
          if (!aaplOk) {
            throw new Error("Render reported the new commit, but /api/ratings/AAPL did not verify successfully.");
          }

          console.log(`Verified Render production startup commit ${sourceCommit} and /api/ratings/AAPL.`);
          NODE
