# TS: 2026-08-26 21:01 ET

name: Monster Rating status ledger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rating-status-ledger.yml"
  workflow_run:
    workflows: ["Monster Rating rollout worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  record-status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kick Monster Rating worker on install/manual run
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rating-rollout-worker.yml --repo "${{ github.repository }}" --ref main

      - name: Fetch live production status
        id: live_status
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p ops
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { resolveBackendDeployTarget } from './scripts/resolve-backend-deploy-target.mjs';
          const base = 'https://next-years-monsters-api.onrender.com';
          const firstMilestone = 500;
          async function get(path) {
            const response = await fetch(base + path, {
              headers: { Accept: 'application/json' },
              signal: AbortSignal.timeout(90000),
            });
            const body = await response.json().catch(() => null);
            return { status: response.status, body };
          }
          const [health, universe, startup, aaplRating] = await Promise.all([
            get('/api/health'),
            get('/api/universe/status?limit=5000'),
            get('/api/startup-status'),
            get('/api/ratings/AAPL'),
          ]);
          const repositoryHeadCommit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const backendDeployTargetCommit = resolveBackendDeployTarget();
          const deployedCommit = startup.body?.deployment?.commit ?? startup.body?.deploymentCommit ?? null;
          const ratingJob = startup.body?.jobs?.ratingBatch ?? null;
          const marketConfigured = health.body?.marketData?.configured ?? null;
          const ratingCompleteCount = Number(universe.body?.ratingCompleteCount ?? 0);
          const quoteCompleteCount = Number(universe.body?.quoteCompleteCount ?? 0);
          let previousRatingCompleteCount = null;
          let previousQuoteCompleteCount = null;
          try {
            if (fs.existsSync('ops/rating-status.json')) {
              const previous = JSON.parse(fs.readFileSync('ops/rating-status.json', 'utf8'));
              const priorRating = Number(previous?.ratingCompleteCount);
              const priorQuote = Number(previous?.quoteCompleteCount);
              previousRatingCompleteCount = Number.isFinite(priorRating) ? priorRating : null;
              previousQuoteCompleteCount = Number.isFinite(priorQuote) ? priorQuote : null;
            }
          } catch (error) {
            console.warn(`Could not read previous rating status snapshot: ${error instanceof Error ? error.message : String(error)}`);
          }
          const ratingDelta = previousRatingCompleteCount === null ? null : ratingCompleteCount - previousRatingCompleteCount;
          const quoteDelta = previousQuoteCompleteCount === null ? null : quoteCompleteCount - previousQuoteCompleteCount;
          const ratingPerQuoteDelta = quoteDelta && quoteDelta > 0 && ratingDelta !== null
            ? Number((ratingDelta / quoteDelta).toFixed(4))
            : null;
          const milestoneRegression = Boolean(
            previousRatingCompleteCount !== null &&
            previousRatingCompleteCount >= firstMilestone &&
            ratingCompleteCount < firstMilestone
          );
          const staleDeployment = Boolean(deployedCommit && deployedCommit !== backendDeployTargetCommit);
          const ratingRecoveryDisabled = Boolean(
            marketConfigured === true && ratingJob?.summary?.status === 'disabled'
          );
          const ratingRouteMissing = aaplRating.status === 404;
          const needsRecovery = staleDeployment || ratingRecoveryDisabled || ratingRouteMissing || milestoneRegression;

          const hasDeployHook = Boolean(process.env.RENDER_DEPLOY_HOOK_URL?.trim());
          const hasRenderApiKey = Boolean(process.env.RENDER_API_KEY?.trim());
          const hasRenderServiceId = Boolean(process.env.RENDER_SERVICE_ID?.trim());
          const hasRenderApiAuthority = hasRenderApiKey && hasRenderServiceId;
          const hasRenderAuthority = hasDeployHook || hasRenderApiAuthority;
          const hasVercelAuthority = Boolean(process.env.VERCEL_TOKEN?.trim());
          const missingRenderCredentials = [];
          if (!hasDeployHook) missingRenderCredentials.push('RENDER_DEPLOY_HOOK_URL');
          if (!hasRenderApiKey) missingRenderCredentials.push('RENDER_API_KEY');
          if (!hasRenderServiceId) missingRenderCredentials.push('RENDER_SERVICE_ID');

          const status = {
            recordedAt: new Date().toISOString(),
            healthStatus: health.status,
            universeStatus: universe.status,
            startupStatus: startup.status,
            aaplRatingStatus: aaplRating.status,
            aaplRatingEligibilityCode: aaplRating.body?.eligibilityCode ?? null,
            aaplRatingTier: aaplRating.body?.tier ?? null,
            ratingRouteMissing,
            examinedCount: universe.body?.examinedCount ?? null,
            secCompleteCount: universe.body?.secCompleteCount ?? null,
            secEvidenceReadyCount: universe.body?.secEvidenceReadyCount ?? null,
            failedCount: universe.body?.failedCount ?? null,
            unresolvedCount: universe.body?.unresolvedCount ?? null,
            quoteCompleteCount: universe.body?.quoteCompleteCount ?? null,
            ratingCompleteCount: universe.body?.ratingCompleteCount ?? null,
            fullyCompleteCount: universe.body?.fullyCompleteCount ?? null,
            firstMilestone,
            previousRatingCompleteCount,
            previousQuoteCompleteCount,
            ratingDelta,
            quoteDelta,
            ratingPerQuoteDelta,
            milestoneRegression,
            deployedCommit,
            repositoryHeadCommit,
            backendDeployTargetCommit,
            currentMainCommit: backendDeployTargetCommit,
            staleDeployment,
            ratingRecoveryDisabled,
            needsRecovery,
            ratingJob,
            marketConfigured,
            deploymentAuthority: {
              renderDeployHook: hasDeployHook,
              renderApiKey: hasRenderApiKey,
              renderServiceId: hasRenderServiceId,
              renderApiAuthority: hasRenderApiAuthority,
              renderAuthority: hasRenderAuthority,
              vercelAuthority: hasVercelAuthority,
              missingRenderCredentials,
            },
          };
          fs.writeFileSync('ops/rating-status.json', JSON.stringify(status, null, 2) + '\n');
          console.log(JSON.stringify(status, null, 2));
          if (milestoneRegression) {
            console.error(`Monster Rating milestone regression detected: previous=${previousRatingCompleteCount}, current=${ratingCompleteCount}, floor=${firstMilestone}.`);
          }
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `needs_recovery=${needsRecovery}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `render_authority=${hasRenderAuthority}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `milestone_regression=${milestoneRegression}\n`);
          }
          NODE

      - name: Dispatch Render recovery when live rating status proves stale
        if: steps.live_status.outputs.needs_recovery == 'true' && steps.live_status.outputs.render_authority == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run render-redeploy-recovery.yml --repo "${{ github.repository }}" --ref main

      - name: Report blocked recovery authority
        if: steps.live_status.outputs.needs_recovery == 'true' && steps.live_status.outputs.render_authority != 'true'
        run: |
          echo "Render recovery is needed but no authorized Render deployment path is available. See ops/rating-status.json for exact missing credentials, AAPL rating-route status, SEC exceptions, real-provider completion counts, post-500 conversion deltas, and first-500 milestone regression state."

      - name: Commit status snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/rating-status.json
          git diff --cached --quiet && exit 0
          git commit -m "Record live Monster Rating status"
          git push
