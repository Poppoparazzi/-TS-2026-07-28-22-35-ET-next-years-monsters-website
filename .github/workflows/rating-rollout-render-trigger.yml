# TS: 2026-08-22 06:22 ET

name: Trigger rating rollout after Render config changes

on:
  push:
    branches: [main]
    paths:
      - "render.yaml"

permissions:
  actions: write
  contents: read

jobs:
  trigger-rating-rollout:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Monster Rating rollout worker
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run rating-rollout-worker.yml --repo "${{ github.repository }}" --ref main
