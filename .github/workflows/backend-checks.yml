# TS: 2026-08-21 23:25 ET

name: Phase 3 Backend Checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Typecheck and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe live production rating count and one real candidate
        run: |
          node --input-type=module <<'NODE'
          const base = "https://next-years-monsters-api.onrender.com";
          const statusResponse = await fetch(`${base}/api/universe/status?limit=1000`, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(90000),
          });
          const status = await statusResponse.json();
          console.log(`LIVE_RATING_COMPLETE_COUNT=${status.ratingCompleteCount ?? "null"}`);
          console.log(`LIVE_FULLY_COMPLETE_COUNT=${status.fullyCompleteCount ?? "null"}`);
          console.log(`LIVE_RETRIEVED_AT=${status.retrievedAt ?? new Date().toISOString()}`);
          if (!statusResponse.ok) process.exit(1);

          const companies = Array.isArray(status.companies) ? status.companies : [];
          const candidate = companies.find((company) =>
            company &&
            company.ticker &&
            company.hasRating !== true &&
            company.hasSecIdentity === true &&
            company.hasFilings === true &&
            company.hasFacts === true
          );

          if (!candidate) {
            console.log("DIAGNOSTIC=no_eligible_unrated_candidate_returned");
            process.exit(0);
          }

          const ticker = String(candidate.ticker).trim().toUpperCase();
          console.log(`DIAGNOSTIC_CANDIDATE=${ticker}`);
          const ratingResponse = await fetch(`${base}/api/ratings/${encodeURIComponent(ticker)}`, {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(90000),
          });
          const rating = await ratingResponse.json().catch(() => null);
          console.log(`DIAGNOSTIC_HTTP=${ratingResponse.status}`);
          console.log(`DIAGNOSTIC_ELIGIBLE=${rating?.eligible ?? "null"}`);
          console.log(`DIAGNOSTIC_SCORE=${rating?.score ?? "null"}`);
          console.log(`DIAGNOSTIC_CODE=${rating?.eligibilityCode ?? rating?.error ?? "none"}`);
          console.log(`DIAGNOSTIC_MESSAGE=${rating?.message ?? rating?.summary ?? "none"}`);
          NODE

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run typechecks and tests
        run: npm run check
