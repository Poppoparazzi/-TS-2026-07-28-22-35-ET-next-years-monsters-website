# TS: 2026-08-21 22:48 ET

name: Phase 3 Backend Checks

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-3-backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Typecheck and test backend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Probe live production rating count
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch("https://next-years-monsters-api.onrender.com/api/universe/status?limit=1000", {
            headers: { Accept: "application/json" },
            signal: AbortSignal.timeout(90000),
          });
          const body = await response.json();
          console.log(`LIVE_RATING_COMPLETE_COUNT=${body.ratingCompleteCount ?? "null"}`);
          console.log(`LIVE_FULLY_COMPLETE_COUNT=${body.fullyCompleteCount ?? "null"}`);
          console.log(`LIVE_RETRIEVED_AT=${body.retrievedAt ?? new Date().toISOString()}`);
          if (!response.ok) process.exit(1);
          NODE

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm install --no-audit --no-fund

      - name: Run typechecks and tests
        run: npm run check
