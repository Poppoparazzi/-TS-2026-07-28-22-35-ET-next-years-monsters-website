# TS: 2026-08-17 22:00 ET

databases:
  - name: next-years-monsters-db
    plan: free
    region: virginia
    ipAllowList: []

services:
  - type: web
    name: next-years-monsters-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    rootDir: backend
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run check && npm run build
    startCommand: npm run db:migrate && npm run db:verify && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://nextyearsmonsters.com,https://www.nextyearsmonsters.com,https://poppoparazzi.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: next-years-monsters-db
          property: connectionString
      - key: MARKET_DATA_PROVIDER
        value: unconfigured
      - key: SEC_USER_AGENT
        sync: false
      - key: AUTO_IMPORT_UNIVERSE_LIMIT
        value: "4000"
      - key: AUTO_SEC_BATCH_SIZE
        value: "4000"
      - key: SEC_BATCH_CONCURRENCY
        value: "3"
      - key: SEC_BATCH_MAX_AGE_HOURS
        value: "720"
      - key: AUTO_REFRESH_PILOT_ON_START
        value: "true"
      - key: PILOT_REFRESH_MAX_AGE_HOURS
        value: "24"
