# TS: 2026-08-01 14:22 ET

services:
  - type: web
    name: next-years-monsters-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm install --no-audit --no-fund && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://nextyearsmonsters.com,https://www.nextyearsmonsters.com,https://poppoparazzi.github.io
      - key: DATABASE_URL
        sync: false
      - key: MARKET_DATA_PROVIDER
        value: twelve-data
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
