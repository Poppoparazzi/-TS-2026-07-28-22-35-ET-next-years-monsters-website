# TS: 2026-08-01 14:55 ET

services:
  - type: web
    name: next-years-monsters-api
    runtime: node
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: https://nextyearsmonsters.com,https://www.nextyearsmonsters.com,https://poppoparazzi.github.io
      - key: MARKET_DATA_PROVIDER
        value: unconfigured
      - key: SEC_USER_AGENT
        sync: false
